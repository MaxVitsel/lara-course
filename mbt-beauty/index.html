var SL=[{"b": 0, "type": "title"}, {"b": 0, "type": "toc"}, {"b": 0, "n": "Вопрос 1", "t": "Что в этом курсе и сколько тут техники?", "lead": "Курс про технику CENTEK для красоты и здоровья: укладка волос, бритьё и стрижка, массаж и контроль веса. По каждой категории: как работает прибор, чем модели отличаются, какие из них хиты и какие новинки.", "tbl": {"nobadge": 1, "head": ["Группа", "Что внутри (моделей в линейке)"], "rows": [["Волосы", "фены 26 · фен-щётки 6 · стайлеры 5 · выпрямители 17 · щипцы для завивки 8"], ["Бритьё и стрижка", "бритвы, триммеры и эпилятор 22 · машинки для стрижки 27"], ["Здоровье", "электромассажёры и ванночки 8 · напольные весы 13"]]}, "calls": [["mem", "Цвета одной модели считаем одним артикулом. Исключение: CT-2272-carbon и CT-2426-beach, у них отдельные карточки."]], "imgs": ["pCT-2272", "pCT-2156", "pCT-2425"], "link": ["https://centek.ru/catalog/", "Каталог CENTEK"]}, {"b": 0, "n": "Вопрос 2", "t": "Как не ошибиться в характеристиках?", "lead": "Покупатели путают разные цифры. Называйте параметры именно той модели, которая лежит перед ними.", "flow": [["1", "Артикул", "Найдите CT-xxxx на коробке или ценнике"], ["2", "Тип прибора", "Сеть или аккумулятор, сухое или влажное бритьё"], ["3", "Комплект", "Насадки, масло, щёточка, зарядка"], ["4", "Проверка", "Сверьте с карточкой на centek.ru"]], "cards": [["Мощность фена и температура", "Мощность в ваттах это сила потока и скорость сушки. Температура задаётся режимами нагрева. Это разные параметры."], ["Ёмкость и время работы", "Ёмкость аккумулятора в мА·ч и время работы без подзарядки у бритв и машинок у разных моделей отличаются. Называйте минуты из карточки."]], "calls": [["say", "Сейчас сверю артикул и назову точные параметры именно этой модели."], ["err", "Не обещайте то, чего нет в карточке: например, влажное бритьё у модели только для сухого бритья."]], "imgs": ["pCT-2034"], "link": ["https://centek.ru/catalog/", "Каталог CENTEK"]}, {"b": 1, "n": "Вопрос 3", "t": "Как работает фен?", "lead": "Вентилятор втягивает воздух через решётку и гонит его через нагревательный элемент. Горячий воздух выходит из насадки. Кнопка холодного обдува выключает нагрев: поток становится прохладным.", "flow": [["1", "Забор воздуха", "Вентилятор втягивает воздух через решётку"], ["2", "Нагрев", "Воздух проходит через спираль"], ["3", "Подача", "Поток выходит через насадку-концентратор"], ["4", "Холодный обдув", "Нагрев отключен, укладка фиксируется"]], "cards": [["Скорости и режимы нагрева", "У большинства моделей 2 скорости потока и 2–3 режима нагрева. Режимы включаются независимо, поэтому их можно комбинировать."], ["Турмалиновая ионизация", "Закрывает кутикулу волоса при сушке. Волосы меньше электризуются, не теряют лишнюю влагу и выглядят более послушными."]], "calls": [["say", "Холодный обдув в конце укладки закрепляет форму: причёска держится дольше."]], "scheme": "dryer", "imgs": null, "link": ["https://centek.ru/product-category/feny/", "Фены в каталоге"]}, {"b": 1, "n": "Вопрос 4", "t": "Какие бывают фены CENTEK?", "lead": "В линейке 26 фенов от 850 до 2200 Вт. Выбирайте по тому, где и как часто сушат волосы.", "tbl": {"nobadge": 1, "head": ["Вариант", "Что есть", "Артикулы"], "rows": [["С AC-мотором, 2200 Вт", "Съёмный фильтр, два концентратора в комплекте, холодный обдув", "CT-2225, CT-2226, CT-2227"], ["Складные, дорожные", "Складная ручка, петелька для подвешивания, насадка-концентратор. Мощность от 850 до 1600 Вт", "CT-2209, CT-2229, CT-2230, CT-2258"], ["Настенные", "Крепёж на стену, холодный обдув, турмалиновая ионизация", "CT-2251, CT-2252, CT-2253"], ["С магнитными насадками", "Магнитный концентратор, быстро меняется. У CT-2272 ещё диффузор и Smart режим", "CT-2205, CT-2272-carbon, CT-2272"], ["Базовые", "2 скорости потока и 2–3 режима нагрева, у многих холодный обдув и петелька для подвешивания. Мощность 900–2200 Вт", "CT-2201, CT-2202, CT-2203, CT-2204, CT-2216, CT-2239, CT-2240, CT-2241, CT-2242, CT-2254, CT-2260, CT-2261, CT-2221"]]}, "calls   var d=new Date(),ds=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"});
  x.textAlign="center";
  x.font="700 36px Onest, sans-serif";x.fillStyle=K;x.fillText(ds,340,1030);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(190,1045);x.lineTo(490,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ДАТА",340,1080);
  x.font="800 34px Unbounded, Onest, sans-serif";x.fillStyle=K;x.fillText("CENTEK",W-340,1030);
  x.beginPath();x.moveTo(W-490,1045);x.lineTo(W-190,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ОТДЕЛ СЕТЕЙ",W-340,1080);
  /* seal */
  var cx=W/2,cy=1010,r1=84,r2=68;
  x.fillStyle=R;x.beginPath();
  for(var k=0;k<48;k++){var a=k*Math.PI/24,rr=k%2?r2+6:r1;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}
  x.closePath();x.fill();
  x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(cx,cy,56,0,Math.PI*2);x.stroke();
  x.fillStyle="#fff";x.font="800 20px Unbounded, Onest, sans-serif";x.textAlign="center";x.fillText("CENTEK",cx,cy+8);
  x.font="700 14px Onest, sans-serif";x.fillText("★ ★ ★",cx,cy+36);
}
function T_name(){return T.name}
function pdfFromJpeg(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=[],pos=0;
  function add(b){parts.push(b);pos+=b.length}function s(t){add(enc.encode(t))}
  s("%PDF-1.4\n");
  off[1]=pos;s("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=pos;s("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  off[3]=pos;s("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  off[4]=pos;s("4 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n");add(jpg);s("\nendstream endobj\n");
  var cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  off[5]=pos;s("5 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
  var xr=pos;s("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)s(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  s("trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveCert(){
  var msg=document.getElementById("dlmsg"),c=document.getElementById("cert");
  try{
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.92)});
    var jpg=new Uint8Array(await b.arrayBuffer());
    var pdf=pdfFromJpeg(jpg,c.width,c.height),fn="Сертификат CENTEK МБТ - "+T.name+".pdf",dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){dl=null}
    if(dl){await dl.save({filename:fn,data:pdf})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    msg.textContent="Готово.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Сохранение отменено.":"Не удалось сохранить. Сделайте скриншот сертификата."}
}

/* ---------- render ---------- */
function render(){
  var s=SL[cur],blk=BLOCKS[s.b];
  document.documentElement.style.setProperty("--ac",blk.c);
  var h;
  if(s.type==="title")h=titleSlide();else if(s.type==="toc")h=tocSlide();else if(s.type==="cheat")h=cheatSlide();else if(s.type==="test")h=testSlide();else h=std(s);
  stage.innerHTML=h;
  stage.querySelectorAll(".slide").forEach(function(n){n.style.setProperty("--ac",blk.c)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  var t="Слайд "+(cur+1)+" из "+SL.length;document.getElementById("cnt").textContent=t;document.getElementById("cnt2").textContent=t;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SL.length-1;
  document.querySelectorAll(".tab").forEach(function(b,i){b.setAttribute("aria-current",i===s.b?"true":"false")});
  if(s.type==="test"){
    var st=document.getElementById("start");if(st)st.onclick=startTest;
    var fin=document.getElementById("fin");if(fin){fin.onclick=finish;stage.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){T.ans[+r.name.slice(1)]=+r.value;document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}});document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}
    var ag=document.getElementById("again");if(ag)ag.onclick=function(){T.done=false;T.on=false;render()};
    var dl=document.getElementById("dl");if(dl){dl.onclick=saveCert;drawCert();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCert)}
  }
  stage.querySelectorAll("[data-toggle]").forEach(function(b){var sc=b.closest(".scheme");function sync(){b.textContent=sc.classList.contains("open")?sc.getAttribute("data-off"):sc.getAttribute("data-on")}b.onclick=function(){sc.classList.toggle("open");sync()};if(sc.hasAttribute("data-auto"))setTimeout(function(){if(document.body.contains(sc)){sc.classList.add("open");sync()}},700)});
  stage.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"))}});
  window.scrollTo(0,0);
}
function go(i){if(T.on&&SL[i].type!=="test"){return}cur=Math.max(0,Math.min(SL.length-1,i));render()}
var tabs=document.getElementById("tabs");
BLOCKS.forEach(function(b,i){var x=document.createElement("button");x.className="tab";x.textContent=b.n;x.onclick=function(){go(firstOf(i))};tabs.appendChild(x)});
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
