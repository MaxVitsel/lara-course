var SL=[{"b": 0, "type": "title"}, {"b": 0, "type": "toc"}, {"b": 0, "n": "Вопрос 1", "t": "Что в этом курсе и сколько тут техники?", "lead": "Курс про холодильники и морозильники CENTEK: как они охлаждают, какие бывают системы и форматы дверей, чем отличается ларь от шкафа и что сказать покупателю.", "tbl": {"nobadge": 1, "head": ["Группа", "Что внутри (моделей в линейке)"], "rows": [["Холодильники компактные", "7 моделей: барные и малогабаритные"], ["Холодильники с морозилкой", "10 модели с верхней и нижней морозилкой"], ["Cross Door и Side-by-Side", "9 моделей: двухдверные и широкие"], ["Двухкамерные инверторные", "4 модели большого объёма"], ["Морозильные лари", "39 моделей, горизонтальные с откидной крышкой"], ["Морозильные шкафы", "5 моделей, вертикальные с дверью"]]}, "calls": [["mem", "Цвета одной модели считаем одним артикулом: например, CT-1722 бывает белым, бежевым и нержавейкой."]], "imgs": ["pCT-4202", "pCT-1722", "pCT-4005"], "link": ["https://centek.ru/product-category/holodilniki/", "Каталог холодильников"]}, {"b": 0, "n": "Вопрос 2", "t": "Пять вопросов покупателю до выбора холодильника", "lead": "Холодильник выбирают по размеру кухни, семье и привычкам. Эти пять вопросов отсекают лишнее за минуту.", "flow": [["1", "Куда", "Кухня, дача, офис, гостиничный номер"], ["2", "Сколько", "Размер семьи: от этого зависит объём"], ["3", "Какая ниша", "Ширина, высота, куда откроется дверь"], ["4", "Морозилка", "Сверху, снизу или отдельный ларь"], ["5", "Система", "Капельная или No Frost"]], "cards": [["Объём", "Один человек: 40–100 л. Семья из 2–3: примерно 250–350 л. Большая семья: от 400 л и больше."], ["Ниша", "Сначала измерьте высоту и ширину ниши, потом выбирайте модель. Для широких Cross Door и Side-by-Side нужно место под открывание."]], "calls": [["say", "Сколько вас в семье и куда ставим: на кухню или на дачу? Подберу модель по месту."], ["err", "Не называйте объём «на глаз»: сверяйте артикул и размеры в карточке."]], "imgs": ["pCT-1715", "pCT-1722"], "link": ["https://centek.ru/product-category/holodilniki/", "Каталог холодильников"]}, {"b": 1, "n": "Вопрос 3", "t": "Как работает холодильник?", "lead": "Холодильник не вырабатывает холод. Он переносит тепло из камеры наружу. Компрессор гонит хладагент по замкнутому контуру: в испарителе он кипит и забирает тепло из камеры, в конденсаторе сжимается и отдаёт его в комнату.", "flow": [["1", "Испаритель", "Хладагент кипит и забирает тепло из камеры"], ["2", "Компрессор", "Сжимает газ и гонит его дальше"], ["3", "Конденсатор", "Газ остывает и отдаёт тепло в комнату"], ["4", "Терморегулятор", "Выключает компрессор, когда в камере нужная температура"]], "cards": [["Почему задняя стенка тёплая", "Тепло из камеры уходит в конденсатор. Поэтому холодильнику нужен зазор для вентиляции: плотно прижимать к стене нельзя."], ["Климатический класс", "В карточке модели указан климатический класс: он говорит, при какой температуре в помещении холодильник работает нормально."]], "calls": [["say", "Холодильнику нужен небольшой зазор у стены: так он лучше отдаёт тепло и меньше шумит."]], "scheme": "fr_cycle", "imgs": null, "link": ["https://centek.ru/product-category/holodilniki/", "Холодильники в каталоге"]}, {"b": 1, "n": "Вопрос 4", "t": "Капельная система и No Frost: в чём разница?", "lead": "Капельная система размораживается просто: лёд нарастает на задней стенке холодильной камеры, при выключении компрессора тает, вода стекает по желобу в поддон и испаряется. No Frost — ледяной испаритель спрятан, а вентилятор гонит холодный воздух по камере.", "flow": [["1", "Капельная", "Лёд на задней стенке растёт и тает сам, вода стекает в поддон"], ["2", "Морозилка капельной", "Размораживать её нужно вручную"], ["3", "No Frost", "Вентилятор раздувает холод, лёд не оседает на продуктах"], ["4", "Итог", "No Frost: без разморозки, но дороже и чуть шумнее"]], "cards": [["Капельная", "Проще и дешевле. Все компактные и барные модели CENTEK и модели с верхней морозилкой CT-1710, CT-1712, а также CT-1709 и CT-1714 с нижней морозилкой."], ["No Frost", "Не нужно размораживать. У CENTEK это CT-1722, CT-1723, CT-1724, CT-1727, CT-1735, CT-1730, а также Cross Door и Side-by-Side."]], "calls": [["say", "Не хотите размораживать морозилку? Тогда смотрим модели No Frost."], ["err", "Не говорите, что у капельной системы «плохая» заморозка: это другая технология, она проще."]], "scheme": "frost", "imgs": null, "link": ["https://centek.ru/product-category/holodilniki/", "Холодильники в каталоге"]}, {"b": 1, "n": "Вопрос 5", "t": "Что даёт инверторный компрессор?", "lead": "Обычный компрессор работает рывками: включился на полную мощность, выключился. Инверторный меняет обороты плавно и держит температуру ровнее. Это тише и обычно экономичнее.", "flow": [["1", "Обычный", "Работает на полную мощность, потом выключается"], ["2", "Инверторный", "Плавно меняет обороты"], ["3", "Температура", "Держится ровнее, продукты хранятся лучше"], ["4", "Шум", "Меньше резких включений"]], "cards": [["Где это у CENTEK", "Инверторный компрессор указан у CT-1730, Cross Door CT-1742…1747, CT-1756 и CT-4202, у Side-by-Side CT-4200, а также у двухкамерных CT-4201 и CT-4300…4302."], ["Как сказать покупателю", "Инвертор работает плавно и тише. Но точный уровень шума и класс энергопотребления называйте по карточке модели."]], "calls": [["say", "У инверторного холодильника компрессор не щёлкает на полную мощность каждый раз, а работает плавно."]], "scheme": "inv_fr", "imgs": null, "link": ["https://centek.ru/product-category/holodilniki/", "Холодильники в каталоге"]}, {"b": 1, "n": "Вопрос 6", "t": "Какие бывают холодильники по расположению морозилки и дверям", "lead": "Покупатель выбирает формат, потом объём. Расположение морозилки и число дверей определяют, как пользоваться холодильником каждый день.", "flow": [["1", "Морозилка сверху", "Классика: морозилка не мешает заглядывать в холодильную камеру"], ["2", "Морозилка снизу", "Основная камера на уровне глаз, не надо наклоняться"], ["3", "French Door", "Две распашные двери сверху и выдвижной ящик морозилки снизу"], ["4", "Cross Door", "Четыре двери: две сверху и две снизу"], ["5", "Side-by-Side", "Две вертикальные двери рядом: холодильник и морозилка"]], "cards": [["Однодверные", "Компактные модели CT-1700…1704, CT-1715, CT-4210: у части морозильное отделение внутри холодильной камеры."], ["Двухдверные", "Две двери и отдельная морозильная камера, сверху или снизу. Широкие модели 70 см с No Frost: CT-1724, CT-1730."], ["French Door", "Две распашные двери сверху, морозилка внизу выдвижная. От Cross Door отличается тем, что внизу не двери, а ящик."]], "calls": [["mem", "Cross Door и Side-by-Side это форматы дверей, а не системы охлаждения: у наших моделей No Frost и инвертор."]], "scheme": "doors", "imgs": null, "link": ["https://centek.ru/product-category/holodilniki/", "Холодильники в каталоге"]}, {"b": 2, "n": "Вопрос 7", "t": "Компактные и барные холодильники", "lead": "Для дачи, офиса и гостиничного номера. Все модели капельные. Выбирайте по объёму и по тому, нужно ли морозильное отделение.", "tbl": {"nobadge": 0, "head": ["Артикул", "Объём", "Габариты Ш×Г×В, мм", "Морозилка", "Класс", "Управление"], "rows": [["CT-1700", "45/43 л", "472×450×492", "внутри", "A", "Механическое"], ["CT-1701", "44 л", "470×440×495", "нет", "A+", "Механическое"], ["CT-1702", "67/66 л", "445×510×630", "внутри", "A+", "Механическое"], ["CT-1703", "94/93 л", "472×450×860", "внутри", "A+", "Механическое"], ["CT-1704", "87 (62 + 25) л", "470×492×837", "внутри", "A+", "Механическое"], ["CT-1715", "92 л", "474×447×831", "внутри", "A+", "Механическое"], ["CT-4210", "46 л", "470×447×496", "нет", "A+", "Механическое"]]}, "calls": [["mem", "CT-4210 на 46 литров: утопленная ручка и демпфер двери, подходит для ниши и гостиничного номера. CT-1701 со стеклянной дверью."], ["say", "Для дачи или офиса подойдёт компактная модель, а если нужна морозилка, возьмём CT-1700 или CT-1704."]], "imgs": null, "link": ["https://centek.ru/product-category/holodilniki/", "Холодильники в каталоге"]}, {"b": 2, "n": "Вопрос 8", "t": "Двухдверные с верхней и нижней морозилкой, капельные", "lead": "Классические модели без No Frost. У CT-1709 и CT-1714 технология Low Frost: льда намораживается меньше, размораживать приходится реже. У CT-1710 и CT-1712 морозильную камеру размораживают вручную.", "tbl": {"nobadge": 0, "head": ["Артикул", "Морозилка", "Объём", "Габариты Ш×Г×В, мм", "Класс", "Особенности"], "rows": [["CT-1710", "сверху", "127 (87 + 40) л", "470×510×1190", "A+", "3 дверные полки, регулируемые ножки"], ["CT-1712", "сверху", "210 (168 + 42) л", "550×550×1430", "A+", "держит холод 18 ч без питания, перенавешиваемые двери"], ["CT-1709", "снизу", "174 (115 + 59) л", "470×511×1500", "A+", "зона свежести, звуковая индикация двери"], ["CT-1714", "снизу", "262 (197 + 65) л", "547×568×1773", "A+", "держит холод 18 ч без питания, зона свежести"]]}, "calls": [["mem", "CT-1714 вместительнее: 262 литра. CT-1710 компактнее: 127 литров."]], "imgs": null, "link": ["https://centek.ru/product-category/holodilniki/", "Холодильники в каталоге"]}, {"b": 2, "n": "Вопрос 9", "t": "Двухдверные с нижней морозилкой и No Frost", "lead": "Не нужно размораживать. Морозилка снизу, основная камера на уровне глаз. Модели отличаются объёмом и классом энергопотребления.", "tbl": {"nobadge": 0, "head": ["Артикул", "Морозилка", "Объём", "Габариты Ш×Г×В, мм", "Класс", "Компрессор"], "rows": [["CT-1722", "снизу", "318 (230 + 88) л", "595×630×1880", "A+", "обычный"], ["CT-1723", "снизу", "360 (262 + 98) л", "595×635×2010", "A++", "обычный"], ["CT-1724", "снизу", "439 (323 + 116) л", "700×666×1880", "A+", "обычный"], ["CT-1727", "снизу", "360 (226 + 134) л", "595×660×1850", "A+", "обычный"], ["CT-1735", "снизу", "321 (245 + 76) л", "595×635×2010", "A+", "обычный"], ["CT-1730", "сверху", "477 (367 + 110) л", "700×691×1880", "A++", "инверторный"]]}, "calls": [["say", "Хотите холодильник без разморозки? Смотрите CT-1722 или CT-1735."], ["mem", "CT-1730 с   return '<section class="slide"><div class="hd"><span class="gnum" aria-hidden="true">≡</span><div class="eyebrow"><span class="pill">Содержание</span>'+(BLOCKS.length-1)+' блоков и тест</div><h1>'+CFG.tocTitle+'</h1></div><div class="body solo"><div class="toc">'+qs.map(function(q,i){return '<button style="--ac:'+BLOCKS[q[0]].c+'" data-go="'+firstOf(q[0])+'"><em>'+(i+1)+'</em><b>'+q[1]+'</b>'+q[2]+'</button>'}).join('')+'<button style="--ac:'+BLOCKS[BLOCKS.length-1].c+'" data-go="'+(SL.length-1)+'"><em>★</em><b>Тест и сертификат</b>10 вопросов, 5 минут</button></div></div></section>';
}
function firstOf(b){for(var i=0;i<SL.length;i++)if(SL[i].b===b)return i;return 0}
function cheatSlide(){
  return '<section class="slide"><div class="hd"><span class="gnum" aria-hidden="true">✓</span><div class="eyebrow"><span class="pill">Шпаргалка</span>распечатайте или сохраните</div><h1>'+CFG.cheatTitle+'</h1></div><div class="body solo"><div>'+flowHtml(CFG.cheatFlow)+tblHtml({head:["Тема","Запомните"],rows:CFG.cheat})+'<a class="site" href="https://centek.ru/" target="_blank" rel="noopener">centek.ru ↗</a></div></div></section>';
}

/* ---------- test UI ---------- */
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
function testSlide(){
  var h='<section class="slide"><div class="hd"><div class="eyebrow">Тест</div><h1>Проверьте себя: 10 вопросов, 5 минут</h1></div><div class="body solo"><div>';
  if(!T.on&&!T.done){
    h+='<p class="lead">Проходной балл 80%, то есть 8 правильных ответов из 10. Время пойдёт после нажатия на кнопку. Тест можно пересдать.</p><div class="row"><label for="fio" style="flex:0 0 100%;font-weight:700">Фамилия, имя, отчество для сертификата</label><input type="text" id="fio" autocomplete="name" placeholder="Иванова Мария Петровна" value="'+T.name.replace(/"/g,'&quot;')+'"><button class="btn" id="start" style="--ac:var(--mint)">Начать тест</button></div>';
  }else if(T.on){
    h+='<div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="timer" id="tm">'+fmt(T.left)+'</div><div class="cnt" id="answered"></div></div>';
    QS.forEach(function(q,i){h+='<div class="q"><h3>'+(i+1)+'. '+q.q+'</h3>'+q.o.map(function(o,j){return '<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+(T.ans[i]===j?' checked':'')+'><span>'+o+'</span></label>'}).join('')+'</div>'});
    h+='<button class="btn" id="fin" style="--ac:var(--mint)">Завершить тест</button>';
  }else{
    var sc=0;QS.forEach(function(q,i){if(T.ans[i]===q.a)sc++});var pass=sc>=8;T.sc=sc;
    h+='<p class="score" style="color:'+(pass?'var(--ok)':'var(--bad)')+'">'+sc+' из 10</p><p class="lead">'+(pass?'Тест сдан. Сертификат готов.':'Нужно 8 из 10. Перечитайте слайды по вопросам, где ошиблись, и попробуйте ещё раз.')+'</p>';
    if(pass){h+='<canvas id="cert" width="1684" height="1191" aria-label="Сертификат"></canvas><div class="row" style="margin-top:12px"><button class="btn" id="dl" style="--ac:var(--red)">Скачать сертификат PDF</button><span class="cnt" id="dlmsg"></span></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">';}
    h+='<h3>Разбор ответов</h3>';
    QS.forEach(function(q,i){h+='<div class="q"><h3>'+(i+1)+'. '+q.q+'</h3>'+q.o.map(function(o,j){var c=j===q.a?' right':(T.ans[i]===j?' wrong':'');return '<div class="opt'+c+'"><span>'+(j===q.a?'✓ ':'')+o+'</span></div>'}).join('')+'</div>'});
    h+='<button class="btn" id="again" style="--ac:var(--mint)">Пройти заново</button>';
  }
  return h+'</div></div></section>';
}
function startTest(){
  var f=document.getElementById("fio");T.name=(f.value||"").trim();
  if(T.name.split(/\s+/).length<2){f.focus();f.style.borderColor="var(--bad)";f.placeholder="Введите минимум фамилию и имя";return}
  T.on=true;T.done=false;T.left=300;T.ans={};render();
  clearInterval(T.timer);T.timer=setInterval(function(){T.left--;var t=document.getElementById("tm");if(t){t.textContent=fmt(T.left);t.classList.toggle("low",T.left<=60)}if(T.left<=0)finish()},1000);
}
function finish(){clearInterval(T.timer);T.on=false;T.done=true;render()}
function drawCert(){
  var c=document.getElementById("cert");if(!c)return;var x=c.getContext("2d"),W=c.width,H=c.height,R="#1863DC",K="#23262B",G="#6B6F76";
  function T(t,y,font,col,ls){x.font=font;x.fillStyle=col;x.textAlign="center";try{x.letterSpacing=(ls||0)+"px"}catch(e){}x.fillText(t,W/2+(ls||0)/2,y);try{x.letterSpacing="0px"}catch(e){}}
  x.fillStyle="#FCF9F4";x.fillRect(0,0,W,H);
  /* fine pattern */
  x.strokeStyle="rgba(24,99,220,0.05)";x.lineWidth=2;
  for(var i=-H;i<W;i+=26){x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke()}
  x.fillStyle="#FCF9F4";x.fillRect(120,120,W-240,H-240);
  /* frames */
  x.strokeStyle=R;x.lineWidth=10;x.strokeRect(56,56,W-112,H-112);
  x.strokeStyle=K;x.lineWidth=2;x.strokeRect(84,84,W-168,H-168);
  x.strokeStyle=R;x.lineWidth=2;x.strokeRect(100,100,W-200,H-200);
  /* corner triangles */
  x.fillStyle=R;
  [[56,56,1,1],[W-56,56,-1,1],[56,H-56,1,-1],[W-56,H-56,-1,-1]].forEach(function(p){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+p[2]*150,p[1]);x.lineTo(p[0],p[1]+p[3]*150);x.closePath();x.fill()});
  /* wordmark */
  T("CENTEK",250,"800 84px Unbounded, Onest, sans-serif",R,18);
  T(CFG.certSub,300,"500 24px Onest, sans-serif",G,8);
  /* title */
  T("СЕРТИФИКАТ",440,"800 112px Unbounded, Onest, sans-serif",K,6);
  T("об обучении",500,"500 40px Onest, sans-serif",R,10);
  /* ornament */
  x.strokeStyle=R;x.lineWidth=3;x.beginPath();x.moveTo(W/2-300,545);x.lineTo(W/2-24,545);x.moveTo(W/2+24,545);x.lineTo(W/2+300,545);x.stroke();
  x.fillStyle=R;x.save();x.translate(W/2,545);x.rotate(Math.PI/4);x.fillRect(-9,-9,18,18);x.restore();
  T("Настоящим подтверждается, что",620,"500 36px Onest, sans-serif",G,0);
  var n=T_name(),fs=104;do{x.font="700 "+fs+"px Onest, sans-serif";fs-=4}while(x.measureText(n).width>W-420&&fs>34);
  T(n,740,"700 "+(fs+4)+"px Onest, sans-serif",K,0);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(W/2-460,775);x.lineTo(W/2+460,775);x.stroke();
  T("успешно прошёл(а) обучение для продавцов",850,"500 38px Onest, sans-serif",K,0);
  T(CFG.certCourse,910,"700 42px Onest, sans-serif",R,0);
  /* footer */
  var d=new Date(),ds=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"});
  x.textAlign="center";
  x.font="700 36px Onest, sans-serif";x.fillStyle=K;x.fillText(ds,340,1030);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(190,1045);x.lineTo(490,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ДАТА",340,1080);
  x.font="800 34px Unbounded, Onest, sans-serif";x.fillStyle=K;x.fillText("CENTEK",W-340,1030);
  x.beginPath();x.moveTo(W-490,1045);x.lineTo(W-190,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ОТДЕЛ СЕТЕЙ",W-340,1080);
  /* seal */
  var cx=W/2,cy=1010,r1=84,r2=68;
  x.fillStyle=R;x.beginPath();
  for(var k=0;k<48;k++){var a=k*Math.PI/24,rr=k%2?r2+6:r1;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}
  x.closePath();x.fill();
  x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(cx,cy,56,0,Math.PI*2);x.stroke();
  x.fillStyle="#fff";x.font="800 20px Unbounded, Onest, sans-serif";x.textAlign="center";x.fillText("CENTEK",cx,cy+8);
  x.font="700 14px Onest, sans-serif";x.fillText("★ ★ ★",cx,cy+36);
}
function T_name(){return T.name}
function pdfFromJpeg(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=[],pos=0;
  function add(b){parts.push(b);pos+=b.length}function s(t){add(enc.encode(t))}
  s("%PDF-1.4\n");
  off[1]=pos;s("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=pos;s("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  off[3]=pos;s("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  off[4]=pos;s("4 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n");add(jpg);s("\nendstream endobj\n");
  var cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  off[5]=pos;s("5 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
  var xr=pos;s("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)s(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  s("trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveCert(){
  var msg=document.getElementById("dlmsg"),c=document.getElementById("cert");
  try{
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.92)});
    var jpg=new Uint8Array(await b.arrayBuffer());
    var pdf=pdfFromJpeg(jpg,c.width,c.height),fn="Сертификат CENTEK МБТ - "+T.name+".pdf",dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){dl=null}
    if(dl){await dl.save({filename:fn,data:pdf})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    msg.textContent="Готово.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Сохранение отменено.":"Не удалось сохранить. Сделайте скриншот сертификата."}
}

/* ---------- render ---------- */
function render(){
  var s=SL[cur],blk=BLOCKS[s.b];
  document.documentElement.style.setProperty("--ac",blk.c);
  var h;
  if(s.type==="title")h=titleSlide();else if(s.type==="toc")h=tocSlide();else if(s.type==="cheat")h=cheatSlide();else if(s.type==="test")h=testSlide();else h=std(s);
  stage.innerHTML=h;
  stage.querySelectorAll(".slide").forEach(function(n){n.style.setProperty("--ac",blk.c)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  var t="Слайд "+(cur+1)+" из "+SL.length;document.getElementById("cnt").textContent=t;document.getElementById("cnt2").textContent=t;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SL.length-1;
  document.querySelectorAll(".tab").forEach(function(b,i){b.setAttribute("aria-current",i===s.b?"true":"false")});
  if(s.type==="test"){
    var st=document.getElementById("start");if(st)st.onclick=startTest;
    var fin=document.getElementById("fin");if(fin){fin.onclick=finish;stage.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){T.ans[+r.name.slice(1)]=+r.value;document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}});document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}
    var ag=document.getElementById("again");if(ag)ag.onclick=function(){T.done=false;T.on=false;render()};
    var dl=document.getElementById("dl");if(dl){dl.onclick=saveCert;drawCert();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCert)}
  }
  stage.querySelectorAll("[data-toggle]").forEach(function(b){var sc=b.closest(".scheme");function sync(){b.textContent=sc.classList.contains("open")?sc.getAttribute("data-off"):sc.getAttribute("data-on")}b.onclick=function(){sc.classList.toggle("open");sync()};if(sc.hasAttribute("data-auto"))setTimeout(function(){if(document.body.contains(sc)){sc.classList.add("open");sync()}},700)});
  stage.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"))}});
  window.scrollTo(0,0);
}
function go(i){if(T.on&&SL[i].type!=="test"){return}cur=Math.max(0,Math.min(SL.length-1,i));render()}
var tabs=document.getElementById("tabs");
BLOCKS.forEach(function(b,i){var x=document.createElement("button");x.className="tab";x.textContent=b.n;x.onclick=function(){go(firstOf(i))};tabs.appendChild(x)});
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
</script>
