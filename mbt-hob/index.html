}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191D; --card:#22252B; --fg:#F1EEE9; --mute:#A7ADB6; --line:#363A42;
  --red:#6FA3FF; --orange:#F2A04A; --mint:#3DCDB9; --ink:#8EA2E8; --on:#17191D; --soft:#3A2228;--bad:#F0455F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191D; --card:#22252B; --fg:#F1EEE9; --mute:#A7ADB6; --line:#363A42;
  --red:#6FA3FF; --orange:#F2A04A; --mint:#3DCDB9; --ink:#8EA2E8; --on:#17191D; --soft:#3A2228;--bad:#F0455F;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.tab[aria-current="true"]{background:var(--ac,var(--red));border-color:var(--ac,var(--red));color:#fff}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac,var(--red));transition:width .25s}
main{padding:20px 0 96px}
.slide{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.hd{background:var(--ac);color:#fff;padding:22px clamp(18px,4vw,40px) 20px;position:relative}
.eyebrow{font:700 12px var(--f-b);letter-spacing:.14em;text-transform:uppercase;opacity:.9}

.badge-new{display:inline-block;background:#fff;color:#1863DC;font:800 12px var(--f-d);letter-spacing:.08em;padding:5px 10px;border-radius:6px;margin-left:10px;vertical-align:middle;transform:rotate(-3deg)}
.body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(16px,3vw,32px);padding:clamp(18px,4vw,36px)}
.body.solo{grid-template-columns:minmax(0,1fr)}
.lead{font-size:clamp(17px,2vw,20px);font-weight:500;margin:0 0 16px;max-width:62ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 16px}
.c{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);min-width:0}
.c b{display:block;color:var(--ac);font-family:var(--f-d);font-size:13px;margin-bottom:4px}
.c span{font-size:15px}
.call{border-radius:14px;padding:14px 16px;margin:0 0 16px;display:flex;gap:12px;align-items:flex-start}
.call .k{flex:0 0 auto;font:800 11px var(--f-d);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;color:#fff;margin-top:2px}
.call.say{background:color-mix(in srgb,var(--mint) 14%,var(--card))}.call.say .k{background:var(--mint)}
.call.mem{background:color-mix(in srgb,var(--orange) 16%,var(--card))}.call.mem .k{background:var(--orange)}
.call.gen{background:color-mix(in srgb,var(--ink) 12%,var(--card))}.call.gen .k{background:var(--ink)}
.call.err{background:var(--soft)}.call.err .k{background:var(--bad)}
.call p{margin:0}
.tblw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:0}

td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.pics{display:grid;gap:12px;align-content:start;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.pic{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;position:relative}
.pic img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;padding:6px}
.pic figcaption{padding:8px 12px;font-size:13px;background:var(--bg);color:var(--mute)}
.pic .ph{aspect-ratio:1/1;display:none;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:var(--f-d);font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000))}
.pic.nf img{display:none}.pic.nf .ph{display:flex}
.pic .tag{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font:800 11px var(--f-d);letter-spacing:.06em;padding:4px 8px;border-radius:5px;z-index:1}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:0 0 16px}
.pair{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg);min-width:0}
.pair .pp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair .plus{font:800 22px var(--f-d);color:var(--ac)}
.pair b{display:block;margin:10px 0 4px;color:var(--ac);font-family:var(--f-d);font-size:13px}
.pair p{margin:0;font-size:14.5px}
.pair .pic figcaption{font-size:11.5px;padding:5px 8px}
@media (max-width:760px){.body{padding:18px}}
.site{display:inline-flex;gap:8px;align-items:center;font:700 14px var(--f-b);text-decoration:none;color:var(--ac);border:1.5px solid var(--ac);border-radius:999px;padding:8px 16px}
.site:hover{background:var(--ac);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav .in{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{font:700 15px var(--f-b);border:0;border-radius:12px;padding:11px 20px;background:var(--ac,var(--red));color:#fff;cursor:pointer}
.btn.ghost{background:color-mix(in srgb,var(--ac,var(--red)) 14%,var(--card));color:var(--fg);border:1px solid color-mix(in srgb,var(--ac,var(--red)) 35%,var(--line))}.btn.ghost:hover:not(:disabled){background:color-mix(in srgb,var(--ac,var(--red)) 24%,var(--card))}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,.opt:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.cnt{font-size:14px;color:var(--mute);text-align:center}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}

.steps{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}

.toc button b{display:block;font-family:var(--f-d);font-size:15px;margin-bottom:4px}

.q{margin:0 0 18px}.q h3{margin:0 0 8px;font-size:17px}

.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}

.timer{font:800 22px var(--f-d);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=text]{font:500 16px var(--f-b);padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0;flex:1 1 260px}
.score{font-family:var(--f-d);font-weight:800;font-size:clamp(34px,6vw,60px);margin:0}
canvas{max-width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
@media (max-width:760px){.body,.hero{grid-template-columns:minmax(0,1fr)}.logo small{display:none}}

var SL=[{"b": 0, "type": "title"}, {"b": 0, "type": "toc"}, {"b": 0, "n": "Вопрос 1", "t": "Что в этом курсе и сколько панелей в линейке?", "lead": "Курс про встраиваемые варочные панели CENTEK: три типа, размеры, подбор под кухню покупателя и что сказать на продаже.", "tbl": {"nobadge": 1, "head": ["Тип", "Что внутри"], "rows": [["Газовые CT-GH", "14 моделей: 30, 45 и 60 см, чугунные решётки, электроподжиг"], ["Индукционные CT-IH", "7 моделей: 30, 45 и 60 см, Booster, Flexi-зона у CT-IH1003 и CT-IH1051"], ["Керамические CT-CH", "5 моделей: 30, 45 и 60 см, инфракрасные нагреватели"]]}, "calls": [["mem", "Гарантия на все варочные панели CENTEK по сайту: 3 года."]], "imgs": ["pCT-GH0052", "pCT-IH1050", "pCT-CH0050"], "link": ["https://centek.ru/product-category/varochnye-paneli/", "Варочные панели в каталоге"]}, {"b": 0, "n": "Вопрос 2", "t": "Пять вопросов покупателю до выбора панели", "lead": "Варочную панель выбирают под кухню: газ или электричество, какой проём и сколько человек готовит.", "flow": [["1", "Энергия", "Есть ли в доме газ или только электричество"], ["2", "Проём", "Какая ширина выреза в столешнице"], ["3", "Семья", "Сколько кастрюль готовится одновременно"], ["4", "Посуда", "Какая посуда уже есть дома"], ["5", "Проводка", "Выдержит ли сеть мощность панели"]], "cards": [["Газ или электричество", "От этого зависит тип. Газовую панель подключает специалист газовой службы."], ["Проём в столешнице", "Сверяйте размер выреза с карточкой. Ширина панели 30, 45 или 60 см, размер выреза чуть меньше."]], "calls": [["say", "Какая у вас кухня: газ или электричество? И какая ширина панели по проёму?"], ["err", "Не подтверждайте установку «на глаз». Размер выреза сверяйте по карточке."]], "imgs": ["pCT-GH0020", "pCT-IH1020"], "link": ["https://centek.ru/product-category/varochnye-paneli/", "Варочные панели в каталоге"]}, {"b": 1, "n": "Вопрос 3", "t": "Как греют газовая, индукционная и керамическая панели?", "lead": "Газовая нагревает дно посуды пламенем. Индукционна   /* footer */
  var d=new Date(),ds=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"});
  x.textAlign="center";
  x.font="700 36px Onest, sans-serif";x.fillStyle=K;x.fillText(ds,340,1030);

  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ОТДЕЛ СЕТЕЙ",W-340,1080);

  x.closePath();x.fill();
  x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(cx,cy,56,0,Math.PI*2);x.stroke();

function T_name(){return T.name}
function pdfFromJpeg(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=[],pos=0;
  function add(b){parts.push(b);pos+=b.length}function s(t){add(enc.encode(t))}
  s("%PDF-1.4\n");
  off[1]=pos;s("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=pos;s("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  off[3]=pos;s("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  off[4]=pos;s("4 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n");add(jpg);s("\nendstream endobj\n");
  var cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  off[5]=pos;s("5 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
  var xr=pos;s("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)s(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  s("trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveCert(){
  var msg=document.getElementById("dlmsg"),c=document.getElementById("cert");
  try{
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.92)});
    var jpg=new Uint8Array(await b.arrayBuffer());
    var pdf=pdfFromJpeg(jpg,c.width,c.height),fn="Сертификат CENTEK МБТ - "+T.name+".pdf",dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){dl=null}
    if(dl){await dl.save({filename:fn,data:pdf})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    msg.textContent="Готово.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Сохранение отменено.":"Не удалось сохранить. Сделайте скриншот сертификата."}
}

/* ---------- render ---------- */
function render(){
  var s=SL[cur],blk=BLOCKS[s.b];
  document.documentElement.style.setProperty("--ac",blk.c);
  var h;
  if(s.type==="title")h=titleSlide();else if(s.type==="toc")h=tocSlide();else if(s.type==="cheat")h=cheatSlide();else if(s.type==="test")h=testSlide();else h=std(s);
  stage.innerHTML=h;
  stage.querySelectorAll(".slide").forEach(function(n){n.style.setProperty("--ac",blk.c)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  var t="Слайд "+(cur+1)+" из "+SL.length;document.getElementById("cnt").textContent=t;document.getElementById("cnt2").textContent=t;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SL.length-1;
  document.querySelectorAll(".tab").forEach(function(b,i){b.setAttribute("aria-current",i===s.b?"true":"false")});
  if(s.type==="test"){
    var st=document.getElementById("start");if(st)st.onclick=startTest;
    var fin=document.getElementById("fin");if(fin){fin.onclick=finish;stage.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){T.ans[+r.name.slice(1)]=+r.value;document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}});document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}
    var ag=document.getElementById("again");if(ag)ag.onclick=function(){T.done=false;T.on=false;render()};
    var dl=document.getElementById("dl");if(dl){dl.onclick=saveCert;drawCert();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCert)}
  }
  stage.querySelectorAll("[data-toggle]").forEach(function(b){var sc=b.closest(".scheme");function sync(){b.textContent=sc.classList.contains("open")?sc.getAttribute("data-off"):sc.getAttribute("data-on")}b.onclick=function(){sc.classList.toggle("open");sync()};if(sc.hasAttribute("data-auto"))setTimeout(function(){if(document.body.contains(sc)){sc.classList.add("open");sync()}},700)});
  stage.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"))}});
  window.scrollTo(0,0);
}
function go(i){if(T.on&&SL[i].type!=="test"){return}cur=Math.max(0,Math.min(SL.length-1,i));render()}
var tabs=document.getElementById("tabs");
BLOCKS.forEach(function(b,i){var x=document.createElement("button");x.className="tab";x.textContent=b.n;x.onclick=function(){go(firstOf(i))};tabs.appendChild(x)});
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
</script>
