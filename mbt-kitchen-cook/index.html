  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.cards.num{counter-reset:c}

.c{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:14px;box-shadow:0 6px 16px -12px rgba(0,0,0,.35)}

th{font-size:13px;letter-spacing:.03em}

var SL=[{"b": 0, "type": "title"}, {"b": 0, "type": "toc"}, {"b": 0, "n": "Вопрос 1", "t": "Что в этом курсе и сколько тут техники?", "lead": "Курс про кухонную технику CENTEK для приготовления. По каждой категории три шага: как работает прибор, чем отличаются модели, что сказать покупателю.", "tbl": {"head": ["Группа", "Что внутри (моделей в линейке)"], "rows": [["Жарка и гриль", "аэрогрили 13 · контактные грили 8 · шашлычницы 2 · фритюрницы 2"], ["Мультиварки, пар, выпечка", "мультиварки 5 · пароварки 4 · су-вид 1 · хлебопечи 6 · йогуртницы 4 · сушилки для овощей 5"], ["Завтрак и быстро", "тостеры 8 · вафельницы и блинницы 7 · микроволновые печи 36 · настольные плитки 11 · вакууматоры 4 · аппарат для сладкой ваты 1"]]}, "calls": [["mem", "Цвета одной модели (например, CT-1456 Red и White) считаем одним артикулом."]], "imgs": ["aero1", "mv1", "toast1"], "link": ["https://centek.ru/catalog/", "Каталог CENTEK"]}, {"b": 0, "n": "Вопрос 2", "t": "Как не ошибиться в характеристиках?", "lead": "У соседних моделей мощность, объём и комплект отличаются. Назвать параметры нужно именно той модели, которая лежит перед покупателем.", "flow": [["1", "Артикул", "Найдите CT-xxxx на коробке или ценнике"], ["2", "Параметры", "Мощность, объём, управление"], ["3", "Комплект", "Что лежит в коробке"], ["4", "Сказать", "Только то, что точно знаете про эту модель"]], "calls": [["say", "Сейчас сверю артикул и назову точные параметры именно этой модели."], ["err", "Не обещайте то, чего нет у модели: время приготовления, «безопасно для детей», ресурс работы."]], "imgs": ["bread"], "link": ["https://centek.ru/catalog/", "Каталог CENTEK"]}, {"b": 1, "n": "Вопрос 3", "t": "Как работает аэрогриль?", "lead": "Это маленькая печь с вентилятором. Горячий воздух постоянно движется вокруг продукта, поэтому корочка получается почти без масла.", "flow": [["1", "Нагрев", "Нагревательный элемент сверху разогревает воздух в чаше"], ["2", "Поток", "Вентилятор гонит горячий воздух по кругу"], ["3", "Корочка", "Воздух обдувает продукт со всех сторон, поверхность подсыхает и румянится"], ["4", "Жир стекает", "Продукт лежит на решётке или в корзине, жир уходит вниз"]], "calls": [["mem", "Это конвекция — тот же принцип, что у духовки с конвекцией, но в малом объёме."], ["say", "Это как маленькая духовка с вентилятором. Греется быстро и жарит воздухом, а не маслом."]], "scheme": "aero", "link": ["https://centek.ru/product-category/ajerogrili/", "Аэрогрили на centek.ru"]}, {"b": 1, "n": "Вопрос 4", "t": "Чем отличаются аэрогрили CENTEK друг от друга?", "lead": "Сравнивайте четыре вещи: объём чаши, мощность, управление и число автопрограмм.", "tbl": {"head": ["Артикул", "Объём", "Мощность", "Таймер", "Управление"], "rows": [["CT-1456", "17 л", "1400 Вт", "120 мин", "Механическое"], ["CT-3101", "5.5 л", "1350 Вт", "60 мин", "Сенсорное"], ["CT-3102", "5.0 л", "1500 Вт", "60 мин", "Сенсорное"], ["CT-3103", "6.5 л", "1900 Вт", "60 мин", "Сенсорное"], ["CT-3104", "9 л", "1900 Вт", "60 мин", "Сенсорное"], ["CT-3105", "5 л", "1500 Вт", "60 мин", "Сенсорное"], ["CT-3106", "6.5 л", "1750 Вт", "60 мин", "Сенсорное"], ["CT-3107", "10 л", "2800 Вт", "60 мин", "Сенсорное"], ["CT-3108", "11.6 л ( 5.8 + 5.8 )", "3200 Вт", "60 мин", "Сенсорное"], ["CT-3109", "5 л", "1650 Вт", "60 мин", "Сенсор / Поворотный переключатель"], ["CT-3110", "6 л / 4 л", "3500 Вт", "60 мин", "Сенсорное"], ["CT-3188", "5 л", "1500 Вт", "60 мин", "Сенсорное"], ["CT-3189", "5 л", "1500 Вт", "60 мин", "Сенсорное"]]}, "cards": [["Объём", "Чем больше чаша, тем больше порция за раз. От 5 л в компактных моделях до 17 л у CT-1456. У CT-3108 две чаши по 5.8 л, у CT-3110 — 6 л и 4 л."], ["Мощность", "Чем выше, тем быстрее нагрев. От 1350 до 3500 Вт."], ["Управление", "Сенсорное у большинства, механическое у двух моделей."], ["Программы", "У моделей, где это указано, от 7 до 10 автоматических программ."]], "calls": [["mem", "Две чаши (CT-3108, CT-3110) удобны, когда нужно приготовить два блюда одновременно."]], "imgs": ["aero1", "aero2"], "link": ["https://centek.ru/product-category/ajerogrili/", "Все аэрогрили в каталоге"]}, {"b": 1, "n": "Вопрос 5", "t": "Покупатель спрашивает: «У меня есть духовка. Зачем аэрогриль?»", "lead": "Разговор про задачи, а не про технику.", "dlg": [["b", "У меня уже есть духовка. Зачем мне ещё аэрогриль?"], ["y", "Он быстрее разогревается и не нагревает всю кухню. Для двоих-троих человек готовить в нём удобнее, чем включать большую духовку."], ["b", "А масло нужно?"], ["y", "Аэрогриль готовит почти без масла: корочку даёт горячий воздух."], ["b", "А сколько влезает?"], ["y", "От 5 литров на двоих до 17 литров на всю семью. Для вас сколько человек?"]], "calls": [["err", "Не называйте время приготовления конкретных блюд и не обещайте «как в ресторане». Говорите про принцип и объём."]], "imgs": ["aero1"]}, {"b": 1, "n": "Вопрос 6", "t": "Как работает контактный гриль?", "lead": "Две нагретые пластины прижимают продукт сверху и снизу. Жарка идёт с двух сторон сразу, лишний жир стекает в поддон.", "flow": [["1", "Нагрев", "Нагреватели в верхней и нижней половинах разогревают пластины"], ["2", "Прижим", "Верхняя крышка опускается на продукт и регулируется по высоте"], ["3", "Жарка", "Тепло идёт к продукту с двух сторон, время жарки короче"], ["4", "Жир стекает", "Антипригарные пластины наклонены, жир уходит в поддон"]], "calls": [["mem", "Если открыть пластины на 180°, они работают как две открытые жарочные поверхности (у моделей с такой функцией)."]], "scheme": "grill", "link": ["https://centek.ru/product-category/grili/", "Грили в каталоге"]}, {"b": 1, "n": "Вопрос 7", "t": "Чем отличаются грили CENTEK?", "lead": "Все 8 моделей с антипригарными пластинами, поддоном для масла и корпусом из нержавеющей стали и пластика.", "tbl": {"head": ["Артикул", "Мощность", "Размер пластин", "Нагрев"], "rows": [["CT-1463", "1800 Вт", "280 х 230 мм", "до 240 °C"], ["CT-1464", "2000 Вт", "297 х 235 мм", "до 240 °C"], ["CT-1465", "2200 Вт", "294 x 242 мм", "до 230 °C"], ["CT-1466", "2000 Вт", "340 х 230 мм", "до 240 °C"], ["CT-1468", "2000 Вт", "290×230 мм", "до 240 °C"], ["CT-1469", "1600 Вт", "254 х 178 мм", "до 240 °C"], ["CT-1470", "2000 Вт", "290×230 мм", "—"], ["CT-1474", "2100 Вт", "297 х 230 мм", "до 230 °C"]]}, "cards": [["Мощность", "От 1600 до 2200 Вт. Чем выше, тем быстрее нагрев."], ["Размер пластин", "От 254×178 до 340×230 мм: влезает больше или меньше продукта."], ["Комплект", "У части моделей 2 или 4 съёмные пластины: проще мыть и можно менять поверхности."], ["Таймер", "Есть не у всех: у двух моделей (30 мин и 4 ч)."]], "calls": [["say", "Хотите готовить стейки, овощи и сэндвичи быстро? Тогда вам сюда. Покажу, какая модель с нужным размером пластин."]], "imgs": ["grill1", "grill2"]}, {"b": 1, "n": "Вопрос 8", "t": "Как работает шашлычница?", "lead": "Вертикальная конструкция: нагреватель стоит по центру, шампуры с мясом вращаются вокруг него.", "flow": [["1", "Нагрев", "Нагреватель разогревает воздух внутри кожуха"], ["2", "Вращение", "Шампуры медленно вращаются: 4 оборота в минуту"], ["3", "Равномерность", "Каждый кусок поворачивается к нагревателю всеми сторонами"], ["4", "Чаши", "Жир и сок стекают в чашечки, дно остаётся чистым"]], "calls": [["mem", "Вращение шампуров выравнивает жарку: мясо не пригорает с одной стороны."]], "cards": [["CT-1461 и CT-1460", "Мощность 1100 Вт, 5 шампуров, защитный кожух."], ["Комплект", "5 шампуров и 5 чашечек; у одной модели ещё дополнительная колба."]], "scheme": "shash", "link": ["https://centek.ru/product-category/shashlychnicy/", "Шашлычницы в каталоге"]}, {"b": 1, "n": "Вопрос 9", "t": "Как работает фритюрница и чем она отличается от аэрогриля?", "lead": "Фритюрница нагревает масло до нужной температуры и жарит продукт в нём. Аэрогриль жарит горячим воздухом.", "flow": [["1", "Масло", "Масло в чаше нагревается до 130–190 °C"], ["2", "Термостат", "Регулятор температуры поддерживает заданный нагрев"], ["3", "Корзина", "Продукт в корзине опускается в масло"], ["4", "Фильтр", "Фильтр на крышке задерживает запах"]], "tbl": {"head": ["Артикул", "Чаша", "Мощность", "Температура"], "rows": [["CT-1430", "1.5 л", "900 Вт", "150-190 °C"], ["CT-1431", "3.5 л", "1800 Вт", "130-190 °C"]]}, "calls": [["mem", "CT-1430: чаша 1.5 л, корзина 0.5 л, 900 Вт. CT-1431: чаша 3.5 л, 1800 Вт, температура 130–190 °C, эмалированное покрытие чаши."], ["say", "Если нужна классическая картошка фри — фритюрница. Если хочется меньше масла — аэрогриль."]], "scheme": "fry", "link": ["https://centek.ru/product-category/fritjurnicy/", "Фритюрницы в каталоге"]}, {"b": 2, "n": "Вопрос 10", "t": "Как работает мультиварка?", "lead": "Это кастрюля с нагревом и «мозгами». Чаша стоит на нагревателе, датчик следит за температурой, а программа сама меняет режим по времени.", "flow": [["1", "Программа", "Выбираете блюдо: суп, каша, тушение, выпечка"], ["2", "Нагрев", "Нагреватель под чашей работает по заданной температуре"], ["3", "Контроль", "Датчик температуры включает и выключает нагрев"], ["4", "Готово", "Таймер заканчивает программу; часть моделей поддерживает подогрев"]], "calls": [["say", "Положили продукты, выбрали программу — дальше она сама. Можно поставить на утро: у многих моделей отсрочка старта до 24 часов."]], "scheme": "mv", "link": ["https://centek.ru/product-category/multivarki/", "Мультиварки в каталоге"]}, {"b": 2, "n": "Вопрос 11", "t": "Чем отличаются мультиварки CENTEK?", "lead": "Во всех пяти артикулах чаша 5 л. Различаются мощность, число программ, управление и покрытие чаши.", "tbl": {"head": ["Артикул", "Объём", "Мощность", "Программ", "Покрытие", "Отсрочка"], "rows": [["CT-1472", "Чаша 5 л", "860 Вт", "21", "Керамическое", "24 ч"], ["CT-1490", "Чаша 5 л", "860 Вт", "10", "Антипригарное", "24 ч"], ["CT-1495", "Чаша 5 л", "900 Вт", "42", "Антипригарное", "24 ч"], ["CT-1498", "Чаша 5 л", "700 Вт", "38", "Антипригарное", "24 ч"], ["CT-1499", "Чаша 5 л", "900 Вт", "25", "Антипригарное", "24 ч"]]}, "cards": [["Число программ", "От 10 до 42. Больше программ — больше готовых режимов, но простую модель проще освоить."], ["Мультиповар", "Ручная настройка времени и температуры (например, CT-1472)."], ["На пару", "У большинства моделей есть приготовление на пару."], ["Комплект", "Ложка для риса, мерный стакан, суповая ложка; у части моделей книга рецептов или пароварка."]], "calls": [["err", "У CT-1495 в описании сказано про керамику, а в характеристиках «антипригарное». Покрытие этой модели не называйте, пока не сверите по коробке."]], "imgs": ["mv1", "mv2"]}, {"b": 2, "n": "Вопрос 12", "t": "Покупатель: «Мне нужна мультиварка. Какую выбрать?»", "lead": "Три вопроса вместо лекции про программы.", "dlg": [["b", "Хочу мультиварку, но не знаю, какую."], ["y", "Вам важнее много готовых программ или простое управление?"], ["b", "Чтобы просто, но чтобы суп и каша получались."], ["y", "Тогда посмотрим модели с меньшим числом программ и понятным дисплеем. Суп, кашу и тушение умеют все. Хотите, покажу две-три?"], ["b", "А можно на ночь поставить?"], ["y", "Да: у моделей, где указана отсрочка старта, она до 24 часов. Давайте проверим по конкретной карточке."]], "calls": [["mem", "Точный список программ смотрите в инструкции конкретной модели."]], "imgs": ["mv1"]}, {"b": 2, "n": "Вопрос 13", "t": "Как работает пароварка?", "lead": "Вода в резервуаре кипит, пар поднимается вверх через ярусы. Продукты не касаются воды и готовятся паром.", "flow": [["1", "Вода", "Заливаете воду в резервуар"], ["2", "Пар", "Нагреватель превращает воду в пар"], ["3", "Ярусы", "Пар проходит через 3 яруса с продуктами"], ["4", "Таймер", "Таймер выключает прибор: 60 или 90 минут по модели"]], "tbl": {"head": ["Артикул", "Мощность", "Объём", "Управление", "Таймер"], "rows": [["CT-1457", "800 Вт", "1.2 л( для воды), 9 л", "Механическое", "60 мин"], ["CT-1458", "1050 Вт", "1.5 л( для воды), 9 л", "Механическое", "60 мин"], ["CT-1459", "1050 Вт", "1.5 л( для воды), 9 л", "Электронное", "90 мин"], ["CT-1462", "1050 Вт", "1.5 л( для воды), 9 л", "Механическое", "60 мин"]]}, "calls": [["mem", "По описанию CT-1457: три чаши общим объёмом 9 литров, чаша для риса, резервуар для воды 1.2 л с функцией добавления воды во время приготовления, защита при недостатке воды."]], "scheme": "par", "link": ["https://centek.ru/product-category/parovarki/", "Пароварки в каталоге"]}, {"b": 2, "n": "Вопрос 14", "t": "Как работает су-вид?", "lead": "Продукт в вакуумном пакете долго готовится в воде с точной температурой. Температура ниже кипения, поэтому мясо и рыба не пересушиваются.", "flow": [["1", "Вакуум", "Продукт запаивают в пакет без воздуха"], ["2", "Вода", "Погружной нагреватель держит нужную температуру воды"], ["3", "Циркуляция", "Насос перемешивает воду: температура одинакова везде"], ["4", "Выдержка", "Долгое приготовление при мягком нагреве"]], "cards": [["CT-1690", "Мощность 1200 Вт, температура 20–90 °C, таймер до 99 часов, циркуляция 8.5 л/мин, LED-дисплей, класс защиты IPx7."]], "calls": [["say", "Для су-вида пригодится вакууматор: в нашей линейке есть CT-7030–7033."]], "scheme": "sv", "link": ["https://centek.ru/product-category/su-vidy/", "Су-вид в каталоге"]}, {"b": 2, "n": "Вопрос 15", "t": "Как работает хлебопечь и чем отличаются модели?", "lead": "Хлебопечь сама замешивает тесто, даёт ему подойти и выпекает хлеб. От продуктов — до готового хлеба, без рук.", "flow": [["1", "Замес", "Лопасть в форме замешивает тесто"], ["2", "Подъём", "Тесто подходит в тепле"], ["3", "Выпечка", "Нагреватель выпекает хлеб до корочки"], ["4", "Подогрев", "Готовая выпечка некоторое время остаётся тёплой"]], "tbl": {"head": ["Артикул", "Вес выпечки", "Мощность", "Программ", "Отсрочка старта"], "rows": [["CT-1410", "500 г, 750 г", "650 Вт", "19", "15 ч"], ["CT-1415", "1500 г", "860 Вт", "15", "15 ч"], ["CT-1416", "1000 г, 500 г, 750 г", "600 Вт", "18", "15 ч"], ["CT-1417", "1500 г", "850 Вт", "15", "15 ч"], ["CT-1418", "700 г, 900 г", "650 Вт", "12", "13 ч"], ["CT-1419", "1000 г, 500 г, 750 г", "750 Вт", "25", "15 ч"]]}, "calls": [["mem", "По описанию CT-1415: 15 программ, выпечка, йогурты и джемы, поддержка температуры в течение часа, отсрочка старта до 15 часов, два ножа, добавление ингредиентов в процессе, память при отключении электричества на 15 минут."], ["say", "Поставили вечером — утром тёплый хлеб. Отсрочка старта у наших моделей до 13 или 15 часов."]], "scheme": "bread", "link": ["https://centek.ru/product-category/hlebopechi/", "Хлебопечи в каталоге"]}, {"b": 2, "n": "Вопрос 16", "t": "Как работают йогуртница и сушилка для овощей?", "lead": "Обе техники держат мягкую температуру много часов. Йогуртница — тёплую для закваски, сушилка — тёплый воздух для удаления влаги.", "cards": [["Йогуртница", "Поддерживает постоянную тёплую температуру, при которой закваска превращает молоко в йогурт. Диапазон зависит от модели: до 42 °C, 20–50 °C или 20–55 °C."], ["Сушилка", "Вентилятор гонит тёплый воздух через поддоны, влага уходит. Температура 35–70 °C или 35–85 °C, объём 5–20 л."], ["Комплект йогуртницы", "Баночки по 200 мл; в разных моделях 4, 6, 7 или 8 штук."], ["Для чего", "Сушилки описаны для овощей, фруктов, грибов, ягод, трав, мяса и рыбы."]], "tbl": {"head": ["Артикул", "Мощность", "Баночек", "Температура"], "rows": [["CT-1442", "20 Вт", "7", "до 42 °C"], ["CT-1443", "30 Вт", "8", "от 20 до 55 °С"], ["CT-3130", "20 Вт", "6", "от 20 до 50 °С"], ["CT-3131", "20 Вт", "4", "от 20 до 50 °С"]]}, "calls": [], "scheme": ["yog", "dry"], "link": ["https://centek.ru/product-category/jogurtnicy/", "Йогуртницы в каталоге"]}, {"b": 3, "n": "Вопрос 17", "t": "Как работает тостер?", "lead": "Хлеб опускается в слот между нагревательными элементами. Они разогреваются докрасна и подрумянивают его с двух сторон.", "flow": [["1", "Загрузка", "Хлеб в слоте, рычаг опускает его вниз"], ["2", "Нагрев", "Элементы по бокам слота разогреваются"], ["3", "Степень", "Регулятор задаёт время: от лёгкого подогрева до золотистой корочки"], ["4", "Выброс", "По окончании хлеб поднимается; можно нажать «Отмену»"]], "calls": [], "tbl": {"head": ow": [["1", "Магнетрон", "Создаёт микроволны"], ["2", "Камера", "Волны отражаются от стенок и проникают в продукт"], ["3", "Вода в еде", "Молекулы воды колеблются и разогревают продукт"], ["4", "Тарелка", "Поворотная тарелка выравнивает нагрев"]], "calls": [["mem", "Гриль в некоторых печах — это отдельный нагревательный элемент, он даёт корочку."], ["err", "Металлическая посуда и фольга в обычной микроволновке не подходят. Ориентируйтесь на инструкцию к модели."]], "scheme": "mw", "link": ["https://centek.ru/product-category/mikrovolnovye-pechi/", "Микроволновые печи в каталоге"]}, {"b": 3, "n": "Вопрос 20", "t": "Как выбрать микроволновую печь CENTEK?", "lead": "Большинство моделей на 20 л, чаще всего 700 Вт. Смотрите объём, управление и нужен ли гриль.", "tbl": {"head": ["Объём", "Мощность", "Управление", "Артикулы"], "rows": [["20 л", "600 Вт", "Механическое", "CT-MW0001, CT-MW0003-1, CT-MW0003, CT-MW0004"], ["20 л", "700 Вт", "Механическое", "CT-MW0005, CT-1550, CT-1552, CT-1559, CT-1560, CT-1571, CT-1573, CT-1575, CT-1582, CT-1583, CT-1586"], ["20 л", "700 Вт", "Сенсорное, Электронное", "CT-MW0006"], ["20 л", "700 Вт, 800 Вт (мощность гриля)", "Сенсорное", "CT-MW0007"], ["25 л", "900 Вт, 1200 Вт (мощность гриля)", "Сенсорное, Электронное", "CT-MW0008, CT-MW0009, CT-MW0010"], ["25 л", "900 Вт, 1200 Вт (мощность гриля)", "Сенсорное", "CT-MW0011"], ["20 л", "700 Вт", "Электронное", "CT-1551, CT-1562, CT-1565, CT-1574, CT-1584"], ["20 л", "800 Вт", "Механическое", "CT-1553"], ["23 л", "800 Вт", "Электронное", "CT-1561, CT-1563, CT-1563-White, CT-1564"], ["20 л", "800 Вт", "Электронное", "CT-1566"], ["25 л", "900 Вт", "Электронное", "CT-1567"], ["23 л", "900 Вт", "Механическое", "CT-1570"], ["20 л", "700 Вт", "Сенсорное", "CT-1579"], ["25 л", "900 Вт", "Механическое", "CT-1588"]]}, "cards": [["Управление", "Механическое: две ручки, просто. Электронное и сенсорное: дисплей и программы."], ["Мощность", "Чем выше, тем быстрее нагрев; мощность от 600 до 900 Вт, у моделей с грилем — отдельно мощность гриля."], ["Встраиваемые", "CT-MW0008–CT-MW0011: 25 л, 900 Вт, гриль 1200 Вт."], ["Покрытие", "Эмалированное покрытие камеры у всех моделей."]], "calls": [["say", "Вам нужно только разогревать или ещё и готовить с корочкой? Для корочки нужна модель с грилем."]], "imgs": ["mw1", "mw2"]}, {"b": 3, "n": "Вопрос 21", "t": "Покупатель: «Какая микроволновка проще?»", "lead": "Разделите модели по управлению.", "dlg": [["b", "Мне нужна простая микроволновка, чтобы не разбираться."], ["y", "Тогда механическое управление: поворотные ручки мощности и времени. Таких моделей половина."], ["b", "А если хочется готовить по программам?"], ["y", "Берите электронное или сенсорное управление: там дисплей и автоматические программы."], ["b", "А гриль?"], ["y", "Есть у отдельных моделей, например встраиваемых CT-MW0008–0011. Нужна ли вам корочка?"]], "calls": [["mem", "Механическое управление у 18 из 36 артикулов микроволновок, электронное и сенсорное — у остальных 18."]], "imgs": ["mw2"]}, {"b": 3, "n": "Вопрос 22", "t": "Как работают настольные плитки: электро, индукция и газ?", "lead": "Три разных способа нагреть посуду. Тип плитки определяет, какая посуда подойдёт.", "cards": [["Электрическая", "Нагревательный элемент разогревается и греет дно посуды. Модели CT-1506–1509: одна или две конфорки."], ["Индукционная", "Катушка создаёт переменное магнитное поле, оно нагревает дно посуды с магнитным дном. Сама поверхность нагревается от посуды. CT-1514, 1517–1519."], ["Газовая", "Горелка с регулировкой пламени. Модели CT-1520, 1522, 1524: регулировка газа и устойчивое основание."], ["CT-1517", "8 уровней мощности, 7 автопрограмм, сенсорное управление, стеклокерамика Crystal Glass."]], "calls": [["mem", "Подойдёт ли посуда на индукцию, проверяют магнитом: если магнит притягивается ко дну, посуда подходит."], ["say", "Если берёте индукционную плитку, выбирайте посуду с индукционным дном. Индукционное дно есть не у всех серий LARA, уточняйте по модели."], ["err   x.font="700 36px Onest, sans-serif";x.fillStyle=K;x.fillText(ds,340,1030);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(190,1045);x.lineTo(490,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ДАТА",340,1080);
  x.font="800 34px Unbounded, Onest, sans-serif";x.fillStyle=K;x.fillText("CENTEK",W-340,1030);
  x.beginPath();x.moveTo(W-490,1045);x.lineTo(W-190,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ОТДЕЛ СЕТЕЙ",W-340,1080);
  /* seal */
  var cx=W/2,cy=1010,r1=84,r2=68;
  x.fillStyle=R;x.beginPath();
  for(var k=0;k<48;k++){var a=k*Math.PI/24,rr=k%2?r2+6:r1;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}
  x.closePath();x.fill();
  x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(cx,cy,56,0,Math.PI*2);x.stroke();
  x.fillStyle="#fff";x.font="800 20px Unbounded, Onest, sans-serif";x.textAlign="center";x.fillText("CENTEK",cx,cy+8);
  x.font="700 14px Onest, sans-serif";x.fillText("★ ★ ★",cx,cy+36);
}

function pdfFromJpeg(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=[],pos=0;
  function add(b){parts.push(b);pos+=b.length}function s(t){add(enc.encode(t))}
  s("%PDF-1.4\n");
  off[1]=pos;s("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=pos;s("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  off[3]=pos;s("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  off[4]=pos;s("4 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n");add(jpg);s("\nendstream endobj\n");
  var cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  off[5]=pos;s("5 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
  var xr=pos;s("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)s(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  s("trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveCert(){
  var msg=document.getElementById("dlmsg"),c=document.getElementById("cert");
  try{
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.92)});
    var jpg=new Uint8Array(await b.arrayBuffer());
    var pdf=pdfFromJpeg(jpg,c.width,c.height),fn="Сертификат CENTEK МБТ - "+T.name+".pdf",dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){dl=null}
    if(dl){await dl.save({filename:fn,data:pdf})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    msg.textContent="Готово.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Сохранение отменено.":"Не удалось сохранить. Сделайте скриншот сертификата."}
}

/* ---------- render ---------- */
function render(){
  var s=SL[cur],blk=BLOCKS[s.b];
  document.documentElement.style.setProperty("--ac",blk.c);
  var h;
  if(s.type==="title")h=titleSlide();else if(s.type==="toc")h=tocSlide();else if(s.type==="cheat")h=cheatSlide();else if(s.type==="test")h=testSlide();else h=std(s);
  stage.innerHTML=h;
  stage.querySelectorAll(".slide").forEach(function(n){n.style.setProperty("--ac",blk.c)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  var t="Слайд "+(cur+1)+" из "+SL.length;document.getElementById("cnt").textContent=t;document.getElementById("cnt2").textContent=t;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SL.length-1;
  document.querySelectorAll(".tab").forEach(function(b,i){b.setAttribute("aria-current",i===s.b?"true":"false")});
  if(s.type==="test"){
    var st=document.getElementById("start");if(st)st.onclick=startTest;
    var fin=document.getElementById("fin");if(fin){fin.onclick=finish;stage.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){T.ans[+r.name.slice(1)]=+r.value;document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}});document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}
    var ag=document.getElementById("again");if(ag)ag.onclick=function(){T.done=false;T.on=false;render()};
    var dl=document.getElementById("dl");if(dl){dl.onclick=saveCert;drawCert();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCert)}
  }
  stage.querySelectorAll("[data-toggle]").forEach(function(b){var sc=b.closest(".scheme");function sync(){b.textContent=sc.classList.contains("open")?sc.getAttribute("data-off"):sc.getAttribute("data-on")}b.onclick=function(){sc.classList.toggle("open");sync()};if(sc.hasAttribute("data-auto"))setTimeout(function(){if(document.body.contains(sc)){sc.classList.add("open");sync()}},700)});
  stage.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"))}});
  window.scrollTo(0,0);
}
function go(i){if(T.on&&SL[i].type!=="test"){return}cur=Math.max(0,Math.min(SL.length-1,i));render()}

BLOCKS.forEach(function(b,i){var x=document.createElement("button");x.className="tab";x.textContent=b.n;x.onclick=function(){go(firstOf(i))};tabs.appendChild(x)});
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
