.site:hover{background:var(--ac);color:#fff}

.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

var SL=[{"b": 0, "type": "title"}, {"b": 0, "type": "toc"}, {"b": 0, "n": "Вопрос 1", "t": "Что в этом курсе и сколько тут вентиляторов?", "lead": "Курс про вентиляторы CENTEK: как они работают, чем отличаются напольные, настольные, колонные и аккумуляторные, как выбрать по комнате и что сказать покупателю.", "tbl": {"nobadge": 1, "head": ["Группа", "Что внутри (моделей в линейке)"], "rows": [["Напольные", "17 моделей: диаметр 43–51 см, мощность от 40 до 110 Вт"], ["Колонные", "5 моделей: высота 78 см, 48 Вт"], ["Настольные от сети", "3 модели: диаметр от 19 до 34 см"], ["USB и аккумуляторные", "6 моделей: компактные, с зарядкой Type-C или питанием от USB"], ["Настольный с резервуаром", "1 модель CT-5085, резервуар для воды 600 мл"]]}, "calls": [["mem", "Всего 32 моделей, часть из них в нескольких цветах."]], "imgs": ["pCT-5025", "pCT-5080", "pCT-5042"], "link": ["https://centek.ru/product-category/ventilyatory/", "Вентиляторы в каталоге"]}, {"b": 0, "n": "Вопрос 2", "t": "Пять вопросов покупателю до выбора вентилятора", "lead": "Вентилятор выбирают по месту, где он стоит, и по тому, сколько шума можно терпеть. Эти вопросы показывают нужный тип.", "flow": [["1", "Где", "Спальня, кухня, офис, дача, стол"], ["2", "Площадь", "Сколько метров и сколько человек в комнате"], ["3", "Шум", "Спальня или гостиная: нужен ли тихий режим"], ["4", "Управление", "Нужен ли пульт, таймер и ночной режим"], ["5", "Питание", "От розетки или с аккумулятором"]], "cards": [["Размер", "Напольные вентиляторы 43–51 см для комнаты. Настольные 19–34 см на стол. USB-модели 10–19 см берут в поездку или в офис."], ["Что нужно знать", "Вентилятор не охлаждает воздух. Он даёт поток, и от него становится прохладнее."]], "calls": [["say", "Где будет стоять вентилятор и нужен ли пульт или таймер? Подберу вариант."], ["err", "Не обещайте, что вентилятор снизит температуру в комнате."]], "imgs": ["pCT-5010", "pCT-5041"], "link": ["https://centek.ru/product-category/ventilyatory/", "Вентиляторы в каталоге"]}, {"b": 1, "n": "Вопрос 3", "t": "Как работает вентилятор?", "lead": "Мотор вращает лопасти, и они гонят воздух в одну сторону. Поток обдувает кожу, пот испаряется быстрее, и становится прохладнее. Температура воздуха в комнате при этом не меняется.", "flow": [["1", "Мотор", "Раскручивает лопасти"], ["2", "Лопасти", "Создают поток воздуха"], ["3", "Решётка", "Защищает от лопастей"], ["4", "Поворот", "Поток идёт по комнате"]], "cards": [["Диаметр", "Чем больше диаметр, тем больше воздуха вентилятор пропускает. У моделей CENTEK от 10 до 51 см."], ["Скорости", "От 1 до 12 скоростей. Выше скорость, сильнее поток, но больше шум."]], "calls": [["say", "Вентилятор даёт поток воздуха: от него становится прохладнее, даже если температура в комнате прежняя."], ["err", "Не говорите, что вентилятор «охлаждает комнату»."]], "scheme": "fan_air", "imgs": null, "link": ["https://centek.ru/product-category/ventilyatory/", "Вентиляторы в каталоге"]}, {"b": 1, "n": "Вопрос 4", "t": "Какие бывают вентиляторы", "lead": "В линейке CENTEK три формы: напольные, колонные и настольные. Внутри настольных есть USB и аккумуляторные модели.", "cards": [["Напольный", "Круглая решётка на стойке. Самый мощный: 40–110 Вт, диаметр 43–51 см. Подходит для комнаты."], ["Колонный", "Вытянутый корпус высотой 78 см, 48 Вт. Занимает мало места, у моделей автоматическое вращение."], ["Настольный", "Для стола: диаметр от 10 до 34 см. Есть питание от сети, USB и аккумуляторные."]], "calls": [["say", "Нужен вентилятор на пол для комнаты или небольшой на стол?"]], "scheme": "fan_types", "imgs": null, "link": ["https://centek.ru/product-category/ventilyatory/", "Вентиляторы в каталоге"]}, {"b": 1, "n": "Вопрос 5", "t": "Что смотреть в характеристиках", "lead": "У вентиляторов немного параметров. Эти пять помогают выбрать.", "tbl": {"nobadge": 1, "head": ["Параметр", "Что значит"], "rows": [["Мощность, Вт", "Мощность мотора. У напольных 40–110 Вт, у USB-моделей 2,5–12 Вт"], ["Диаметр, см", "Размер решётки: чем больше, тем мощнее поток"], ["Скорости", "Сколько режимов силы потока: от 1 до 12"], ["Поворот на 90°", "Вентилятор поворачивается и обдувает большую часть комнаты"], ["Пульт, таймер, ночной режим", "Удобство управления: можно включить с дивана и выключить по таймеру"], ["Шум", "Для спальни смотрите модели с отметкой «низкий уровень шума»"]]}, "calls": [["err", "Не называйте шум «тихим» без данных из карточки."]], "imgs": ["pCT-5019"], "link": ["https://centek.ru/product-category/ventilyatory/", "Вентиляторы в каталоге"]}, {"b": 1, "n": "Вопрос 6", "t": "Аккумуляторные и USB-вентиляторы", "lead": "Компактные модели, которые можно взять в поездку, на дачу или поставить на рабочий стол. Заряжаются через Type-C и работают без розетки.", "cards": [["Работа без подзарядки", "От 5 часов (CT-5041) до 24 часов (CT-5042). Точное время смотрите в карточке."], ["Работа от сети и аккумулятора", "CT-5041, CT-5042, CT-5043, CT-5044, CT-5045 можно подключать к сети."], ["USB без аккумулятора", "CT-5040 работает от USB-подключения, мощность 2,5 Вт."], ["Трансформеры", "У CT-5042…5045 в характеристиках указано «Трансформер». Как его раскладывать, смотрите в карточке."]], "calls": [["say", "Нужен вентилятор на стол или в дорогу? Возьмите аккумуляторный: ему не нужна розетка."]], "imgs": ["pCT-5042", "pCT-5043"], "link": ["https://centek.ru/product-category/ventilyatory/", "Вентиляторы в каталоге"]}, {"b": 1, "n": "Вопрос 7", "t": "Вентилятор с увлажнением: CT-5050 и CT-5085", "lead": "Две модели с функцией для воды. CT-5050 напольный, 2 в 1: вентилятор и увлажнитель. CT-5085 настольный, резервуар 600 мл.", "cards": [["CT-5050", "Напольный, диаметр 50 см, 9 скоростей, пульт ДУ, LED-дисплей, таймер 9 часов."], ["CT-5085", "Настольный, резервуар для воды 600 мл, 3 скорости, таймер 3 часа, зарядка Type-C."], ["Что сказать", "Эти модели не заменяют увлажнитель воздуха. Подробности работы с водой смотрите в карточке."]], "calls": [["err", "Не обещайте точную площадь увлажнения: данных в ка   return '<section class="slide"><div class="hd"><span class="gnum" aria-hidden="true">✓</span><div class="eyebrow"><span class="pill">Шпаргалка</span>распечатайте или сохраните</div><h1>'+CFG.cheatTitle+'</h1></div><div class="body solo"><div>'+flowHtml(CFG.cheatFlow)+tblHtml({head:["Тема","Запомните"],rows:CFG.cheat})+'<a class="site" href="https://centek.ru/" target="_blank" rel="noopener">centek.ru ↗</a></div></div></section>';
}

/* ---------- test UI ---------- */
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
function testSlide(){
  var h='<section class="slide"><div class="hd"><div class="eyebrow">Тест</div><h1>Проверьте себя: 10 вопросов, 5 минут</h1></div><div class="body solo"><div>';
  if(!T.on&&!T.done){
    h+='<p class="lead">Проходной балл 80%, то есть 8 правильных ответов из 10. Время пойдёт после нажатия на кнопку. Тест можно пересдать.</p><div class="row"><label for="fio" style="flex:0 0 100%;font-weight:700">Фамилия, имя, отчество для сертификата</label><input type="text" id="fio" autocomplete="name" placeholder="Иванова Мария Петровна" value="'+T.name.replace(/"/g,'&quot;')+'"><button class="btn" id="start" style="--ac:var(--mint)">Начать тест</button></div>';
  }else if(T.on){
    h+='<div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="timer" id="tm">'+fmt(T.left)+'</div><div class="cnt" id="answered"></div></div>';
    QS.forEach(function(q,i){h+='<div class="q"><h3>'+(i+1)+'. '+q.q+'</h3>'+q.o.map(function(o,j){return '<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+(T.ans[i]===j?' checked':'')+'><span>'+o+'</span></label>'}).join('')+'</div>'});
    h+='<button class="btn" id="fin" style="--ac:var(--mint)">Завершить тест</button>';
  }else{
    var sc=0;QS.forEach(function(q,i){if(T.ans[i]===q.a)sc++});var pass=sc>=8;T.sc=sc;
    h+='<p class="score" style="color:'+(pass?'var(--ok)':'var(--bad)')+'">'+sc+' из 10</p><p class="lead">'+(pass?'Тест сдан. Сертификат готов.':'Нужно 8 из 10. Перечитайте слайды по вопросам, где ошиблись, и попробуйте ещё раз.')+'</p>';
    if(pass){h+='<canvas id="cert" width="1684" height="1191" aria-label="Сертификат"></canvas><div class="row" style="margin-top:12px"><button class="btn" id="dl" style="--ac:var(--red)">Скачать сертификат PDF</button><span class="cnt" id="dlmsg"></span></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">';}
    h+='<h3>Разбор ответов</h3>';
    QS.forEach(function(q,i){h+='<div class="q"><h3>'+(i+1)+'. '+q.q+'</h3>'+q.o.map(function(o,j){var c=j===q.a?' right':(T.ans[i]===j?' wrong':'');return '<div class="opt'+c+'"><span>'+(j===q.a?'✓ ':'')+o+'</span></div>'}).join('')+'</div>'});
    h+='<button class="btn" id="again" style="--ac:var(--mint)">Пройти заново</button>';
  }
  return h+'</div></div></section>';
}
function startTest(){
  var f=document.getElementById("fio");T.name=(f.value||"").trim();
  if(T.name.split(/\s+/).length<2){f.focus();f.style.borderColor="var(--bad)";f.placeholder="Введите минимум фамилию и имя";return}
  T.on=true;T.done=false;T.left=300;T.ans={};render();
  clearInterval(T.timer);T.timer=setInterval(function(){T.left--;var t=document.getElementById("tm");if(t){t.textContent=fmt(T.left);t.classList.toggle("low",T.left<=60)}if(T.left<=0)finish()},1000);
}
function finish(){clearInterval(T.timer);T.on=false;T.done=true;render()}
function drawCert(){
  var c=document.getElementById("cert");if(!c)return;var x=c.getContext("2d"),W=c.width,H=c.height,R="#1863DC",K="#23262B",G="#6B6F76";
  function T(t,y,font,col,ls){x.font=font;x.fillStyle=col;x.textAlign="center";try{x.letterSpacing=(ls||0)+"px"}catch(e){}x.fillText(t,W/2+(ls||0)/2,y);try{x.letterSpacing="0px"}catch(e){}}
  x.fillStyle="#FCF9F4";x.fillRect(0,0,W,H);
  /* fine pattern */
  x.strokeStyle="rgba(24,99,220,0.05)";x.lineWidth=2;
  for(var i=-H;i<W;i+=26){x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke()}
  x.fillStyle="#FCF9F4";x.fillRect(120,120,W-240,H-240);
  /* frames */
  x.strokeStyle=R;x.lineWidth=10;x.strokeRect(56,56,W-112,H-112);
  x.strokeStyle=K;x.lineWidth=2;x.strokeRect(84,84,W-168,H-168);
  x.strokeStyle=R;x.lineWidth=2;x.strokeRect(100,100,W-200,H-200);
  /* corner triangles */
  x.fillStyle=R;
  [[56,56,1,1],[W-56,56,-1,1],[56,H-56,1,-1],[W-56,H-56,-1,-1]].forEach(function(p){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+p[2]*150,p[1]);x.lineTo(p[0],p[1]+p[3]*150);x.closePath();x.fill()});
  /* wordmark */
  T("CENTEK",250,"800 84px Unbounded, Onest, sans-serif",R,18);
  T(CFG.certSub,300,"500 24px Onest, sans-serif",G,8);
  /* title */
  T("СЕРТИФИКАТ",440,"800 112px Unbounded, Onest, sans-serif",K,6);
  T("об обучении",500,"500 40px Onest, sans-serif",R,10);
  /* ornament */
  x.strokeStyle=R;x.lineWidth=3;x.beginPath();x.moveTo(W/2-300,545);x.lineTo(W/2-24,545);x.moveTo(W/2+24,545);x.lineTo(W/2+300,545);x.stroke();
  x.fillStyle=R;x.save();x.translate(W/2,545);x.rotate(Math.PI/4);x.fillRect(-9,-9,18,18);x.restore();
  T("Настоящим подтверждается, что",620,"500 36px Onest, sans-serif",G,0);
  var n=T_name(),fs=104;do{x.font="700 "+fs+"px Onest, sans-serif";fs-=4}while(x.measureText(n).width>W-420&&fs>34);
  T(n,740,"700 "+(fs+4)+"px Onest, sans-serif",K,0);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(W/2-460,775);x.lineTo(W/2+460,775);x.stroke();
  T("успешно прошёл(а) обучение для продавцов",850,"500 38px Onest, sans-serif",K,0);
  T(CFG.certCourse,910,"700 42px Onest, sans-serif",R,0);
  /* footer */
  var d=new Date(),ds=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"});
  x.textAlign="center";
  x.font="700 36px Onest, sans-serif";x.fillStyle=K;x.fillText(ds,340,1030);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(190,1045);x.lineTo(490,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ДАТА",340,1080);
  x.font="800 34px Unbounded, Onest, sans-serif";x.fillStyle=K;x.fillText("CENTEK",W-340,1030);
  x.beginPath();x.moveTo(W-490,1045);x.lineTo(W-190,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ОТДЕЛ СЕТЕЙ",W-340,1080);
  /* seal */
  var cx=W/2,cy=1010,r1=84,r2=68;
  x.fillStyle=R;x.beginPath();
  for(var k=0;k<48;k++){var a=k*Math.PI/24,rr=k%2?r2+6:r1;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}
  x.closePath();x.fill();
  x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(cx,cy,56,0,Math.PI*2);x.stroke();
  x.fillStyle="#fff";x.font="800 20px Unbounded, Onest, sans-serif";x.textAlign="center";x.fillText("CENTEK",cx,cy+8);
  x.font="700 14px Onest, sans-serif";x.fillText("★ ★ ★",cx,cy+36);
}
function T_name(){return T.name}
function pdfFromJpeg(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=[],pos=0;
  function add(b){parts.push(b);pos+=b.length}function s(t){add(enc.encode(t))}
  s("%PDF-1.4\n");
  off[1]=pos;s("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=pos;s("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  off[3]=pos;s("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  off[4]=pos;s("4 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n");add(jpg);s("\nendstream endobj\n");
  var cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  off[5]=pos;s("5 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
  var xr=pos;s("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)s(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  s("trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveCert(){
  var msg=document.getElementById("dlmsg"),c=document.getElementById("cert");
  try{
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.92)});
    var jpg=new Uint8Array(await b.arrayBuffer());
    var pdf=pdfFromJpeg(jpg,c.width,c.height),fn="Сертификат CENTEK МБТ - "+T.name+".pdf",dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){dl=null}
    if(dl){await dl.save({filename:fn,data:pdf})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    msg.textContent="Готово.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Сохранение отменено.":"Не удалось сохранить. Сделайте скриншот сертификата."}
}

/* ---------- render ---------- */
function render(){
  var s=SL[cur],blk=BLOCKS[s.b];
  document.documentElement.style.setProperty("--ac",blk.c);
  var h;
  if(s.type==="title")h=titleSlide();else if(s.type==="toc")h=tocSlide();else if(s.type==="cheat")h=cheatSlide();else if(s.type==="test")h=testSlide();else h=std(s);
  stage.innerHTML=h;
  stage.querySelectorAll(".slide").forEach(function(n){n.style.setProperty("--ac",blk.c)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  var t="Слайд "+(cur+1)+" из "+SL.length;document.getElementById("cnt").textContent=t;document.getElementById("cnt2").textContent=t;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SL.length-1;
  document.querySelectorAll(".tab").forEach(function(b,i){b.setAttribute("aria-current",i===s.b?"true":"false")});
  if(s.type==="test"){
    var st=document.getElementById("start");if(st)st.onclick=startTest;
    var fin=document.getElementById("fin");if(fin){fin.onclick=finish;stage.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){T.ans[+r.name.slice(1)]=+r.value;document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}});document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}
    var ag=document.getElementById("again");if(ag)ag.onclick=function(){T.done=false;T.on=false;render()};
    var dl=document.getElementById("dl");if(dl){dl.onclick=saveCert;drawCert();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCert)}
  }
  stage.querySelectorAll("[data-toggle]").forEach(function(b){var sc=b.closest(".scheme");function sync(){b.textContent=sc.classList.contains("open")?sc.getAttribute("data-off"):sc.getAttribute("data-on")}b.onclick=function(){sc.classList.toggle("open");sync()};if(sc.hasAttribute("data-auto"))setTimeout(function(){if(document.body.contains(sc)){sc.classList.add("open");sync()}},700)});
  stage.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"))}});
  window.scrollTo(0,0);
}
function go(i){if(T.on&&SL[i].type!=="test"){return}cur=Math.max(0,Math.min(SL.length-1,i));render()}
var tabs=document.getElementById("tabs");
BLOCKS.forEach(function(b,i){var x=document.createElement("button");x.className="tab";x.textContent=b.n;x.onclick=function(){go(firstOf(i))};tabs.appendChild(x)});
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
</script>
