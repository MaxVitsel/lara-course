var SL=[{"b": 0, "type": "title"}, {"b": 0, "type": "toc"}, {"b": 0, "n": "Вопрос 1", "t": "Что в этом курсе и сколько тут техники?", "lead": "Курс про телевизоры CENTEK: как устроен экран, чем отличаются LED и QLED, что даёт Smart TV и какую модель предложить покупателю.", "tbl": {"nobadge": 1, "head": ["Группа", "Что внутри (моделей в линейке)"], "rows": [["Без Smart TV", "4 модели: простые, с цифровым тюнером"], ["Android 9 (AOSP)", "3 модели с Smart TV и голосовым пультом"], ["Smart TV с Yandex OS, HD и Full HD", "9 моделей от 24 до 43 дюймов"], ["Smart TV с Yandex OS, 4K", "9 моделей от 50 до 85 дюймов"], ["QLED", "15 моделей трёх серий: TV0010, TV0021, TV0022"]]}, "calls": [["mem", "Всего 40 моделей. Размеры одной модели (например, 32 и 43 дюйма) в серии TV0010, TV0021 и TV0022 считаем отдельными артикулами."]], "imgs": ["pCT-TV0022-43", "pCT-8855", "pCT-8632"], "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 0, "n": "Вопрос 2", "t": "Пять вопросов покупателю до выбора телевизора", "lead": "Телевизор выбирают по комнате, расстоянию до экрана и тому, нужны ли онлайн-сервисы.", "flow": [["1", "Куда", "Кухня, спальня, гостиная, дача"], ["2", "Расстояние", "Сколько метров от дивана до экрана"], ["3", "Smart TV", "Нужны ли приложения и интернет"], ["4", "Картинка", "HD, Full HD или 4K; LED или QLED"], ["5", "Крепление", "На подставку или на стену (VESA)"]], "cards": [["Диагональ", "Ориентир: от глаз до экрана 2–3 диагонали. Для 43 дюймов (109 см) это примерно 2,2–3,3 метра. Для 4K можно садиться ближе."], ["Куда ставить", "Под ТВ 24 дюйма хватит кухонной полки, 55 дюймов нужна тумба шириной от 125 см или кронштейн."]], "calls": [["say", "Где будет стоять телевизор и сколько метров до дивана? Подберу диагональ."], ["err", "Не называйте диагональ «на глаз»: сверяйте модель и размер корпуса в карточке."]], "imgs": ["pCT-8843", "pCT-8855"], "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 1, "n": "Вопрос 3", "t": "Как работает LED-телевизор?", "lead": "Экран состоит из слоёв. Сзади светят светодиоды, свет проходит через рассеиватель, ЖК-слой и цветной фильтр. ЖК-слой в каждой точке регулирует, сколько света пройдёт, а фильтр окрашивает его в красный, зелёный или синий. Так складывается картинка.", "flow": [["1", "Подсветка", "Светодиоды дают белый свет"], ["2", "Рассеиватель", "Свет распределяется равномерно по экрану"], ["3", "ЖК-слой", "В каждой точке пропускает больше или меньше света"], ["4", "Цветной фильтр", "Из точек складывается цветное изображение"]], "cards": [["Яркость", "Измеряется в кд/м². У моделей CENTEK от 180 до 400 кд/м². Чем светлее комната, тем важнее запас яркости."], ["Контрастность", "Соотношение самого светлого и тёмного. У моделей CENTEK от 3000:1 до 5000:1."]], "calls": [["say", "В светлой комнате лучше брать модель поярче: картинка не выцветает при дневном свете."]], "scheme": "tv_led", "imgs": null, "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 1, "n": "Вопрос 4", "t": "Что такое QLED и чем отличается от LED?", "lead": "В QLED между подсветкой и экраном лежит слой квантовых точек. Подсветка синяя, точки преобразуют её в чистый красный и зелёный. Цвета получаются насыщеннее и точнее, чем у обычного LED-экрана.", "flow": [["1", "Синяя подсветка", "Светодиоды дают синий свет"], ["2", "Квантовые точки", "Часть света превращается в красный и зелёный"], ["3", "ЖК-слой", "Регулирует яркость каждой точки"], ["4", "Экран", "Насыщенные и чистые цвета"]], "cards": [["Где у CENTEK", "QLED-модели: серии CT-TV0010, CT-TV0021 и CT-TV0022, от 32 до 55 дюймов. В новой серии CT-TV0022 указана технология Quantum Dot."], ["Как сказать", "Цвета насыщеннее и ярче. Но QLED это не OLED: подсветка у экрана общая."]], "calls": [["say", "В QLED цвета ярче и насыщеннее: хорошо видно в фильмах и играх."], ["err", "Не говорите, что QLED «лучше всех». Опирайтесь на яркость, разрешение и данные модели."]], "scheme": "tv_qled", "imgs": null, "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 1, "n": "Вопрос 5", "t": "HD ready, Full HD и 4K: чем отличается разрешение", "lead": "Разрешение это число точек на экране. Чем их больше, тем чётче картинка. Разница заметна на большой диагонали и при просмотре вблизи.", "flow": [["1", "HD ready", "1366×768: 24 и 32 дюйма"], ["2", "Full HD", "1920×1080: 32, 40 и 43 дюйма"], ["3", "4K", "3840×2160: от 50 до 85 дюймов"], ["4", "Контент", "Эфирное ТВ не всегда 4K, а стриминг и YouTube часто есть"]], "cards": [["Какую диагональ какому разрешению", "24 и 32 дюйма хватит HD ready для кухни. 40 и 43 дюйма лучше Full HD. От 50 дюймов 4K заметно чётче."], ["Не путайте", "4K на маленьком экране заметен мало. На 50 дюймах и больше разница видна сразу."]], "calls": [["say", "Телевизор на кухню? HD ready хватит. А в зал на 55 дюймов лучше 4K."]], "scheme": "tv_res", "imgs": null, "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 1, "n": "Вопрос 6", "t": "Smart TV, Yandex OS и голосовой пульт", "lead": "Smart TV это телевизор с операционной системой: приложения, видеосервисы и интернет прямо на экране. У большинства моделей CENTEK стоит Yandex OS на Android 11 и пульт с голосовым управлением.", "cards": [["Yandex OS", "Android 11 (Yandex OS) у серий CT-87xx, CT-88xx, CT-8932 и QLED. У CT-8558…8585 Android 9 (Yandex OS)."], ["Android 9 (AOSP)", "Базовая версия Android без Yandex OS: CT-8532, CT-8540, CT-8550."], ["Без Smart", "CT-8624, CT-8632, CT-8640, CT-8643: цифровой тюнер DVB-T2/C/S2, подключение флешки и HDMI, без интернета."], ["Голосовое управление", "Пульт с голосовым управлением у всех Smart-моделей CENTEK. Работает после подключения к интернету."]], "calls": [["say", "Нужны приложения и онлайн-кинотеатры? Тогда берём Smart TV. Если просто эфир, подойдёт модель без Smart."], ["err", "Не обещайте конкретные приложения и подписки: уточняйте в карточке и настройках."]], "imgs": ["pCT-8840", "pCT-8643"], "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 1, "n": "Вопрос 7", "t": "Входы, тюнеры и крепление: что смотреть в карточке", "lead": "Перед покупкой проверьте, что телевизор подключится ко всему, что есть у покупателя: приставкам, саундбару, флешке.", "cards": [["HDMI и USB", "У моделей CENTEK от 2 до 3 входов HDMI и от 1 до 2 портов USB. Для приставки и саундбара достаточно 3 HDMI."], ["Тюнер", "Цифровой тюнер DVB-T2/C есть у всех. DVB-S/S2 (спутник) указан у большинства Smart-моделей и QLED."], ["CI", "Слот CI для модуля условного доступа указан у моделей с кабельным и спутниковым ТВ, например у серии CT-85xx и QLED CT-TV0010."], ["VESA", "Крепление VESA 100×100, 200×100 или 200×200 мм: по нему подбирают кронштейн."]], "calls": [["mem", "Размер телевизора без подставки нужен для выбора тумбы. Размеры лежат в карточке модели."]], "imgs": null, "link": ["https://centek.ru/product-category/televizory/", "Телевизоры в каталоге"]}, {"b": 2, "n": "Вопрос 8", "t": "Деление линейки: как устроен прайс", "lead": "В прайсе телевизоры делятся на две группы: с поддержкой Smart TV и без неё. На сайте Smart-модели ещё разделены по операционной системе и экрану.", "tbl": {"nobadge": 1, "head": ["Группа", "Что отличает", "Артикулы"], "rows": [["Без Smart TV", "Цифровой тюнер, 24–43 дюйма, HD ready и Full HD", "CT-8624, CT-8632, CT-8640, CT-8643"], ["Android 9 (AOSP)", "Smart TV, 32, 40 и 50 дюймов", "CT-8532, CT-8540, CT-8550"], ["Yandex OS, HD и Full HD", "Smart TV, 24–43 дюйма", "CT-8724, CT-8732, CT-8740, CT-8743, CT-8824, CT-8832, CT-8840, CT-8843, CT-8932"], ["Yandex OS, 4K", "Smart TV, 50–85 дюймов", "CT-8750, CT-8765, CT-8850, CT-8855, CT-8865, CT-8558, CT-8565, CT-8575, CT-8585"], ["QLED", "Квантовые точки, 32–55 дюймов, серии TV0010, TV0021, TV0022", "CT-TV0010-32, CT-TV0010-40-1, CT-TV0010-43, CT-TV0010-50, CT-TV0010-55; CT-TV0021-32, CT-TV0021-40, CT-TV0021-43, CT-TV0021-5   x.fillStyle="#FCF9F4";x.fillRect(120,120,W-240,H-240);

  x.strokeStyle=R;x.lineWidth=10;x.strokeRect(56,56,W-112,H-112);
  x.strokeStyle=K;x.lineWidth=2;x.strokeRect(84,84,W-168,H-168);
  x.strokeStyle=R;x.lineWidth=2;x.strokeRect(100,100,W-200,H-200);
  /* corner triangles */
  x.fillStyle=R;
  [[56,56,1,1],[W-56,56,-1,1],[56,H-56,1,-1],[W-56,H-56,-1,-1]].forEach(function(p){x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+p[2]*150,p[1]);x.lineTo(p[0],p[1]+p[3]*150);x.closePath();x.fill()});
  /* wordmark */
  T("CENTEK",250,"800 84px Unbounded, Onest, sans-serif",R,18);
  T(CFG.certSub,300,"500 24px Onest, sans-serif",G,8);
  /* title */
  T("СЕРТИФИКАТ",440,"800 112px Unbounded, Onest, sans-serif",K,6);
  T("об обучении",500,"500 40px Onest, sans-serif",R,10);
  /* ornament */
  x.strokeStyle=R;x.lineWidth=3;x.beginPath();x.moveTo(W/2-300,545);x.lineTo(W/2-24,545);x.moveTo(W/2+24,545);x.lineTo(W/2+300,545);x.stroke();
  x.fillStyle=R;x.save();x.translate(W/2,545);x.rotate(Math.PI/4);x.fillRect(-9,-9,18,18);x.restore();
  T("Настоящим подтверждается, что",620,"500 36px Onest, sans-serif",G,0);
  var n=T_name(),fs=104;do{x.font="700 "+fs+"px Onest, sans-serif";fs-=4}while(x.measureText(n).width>W-420&&fs>34);
  T(n,740,"700 "+(fs+4)+"px Onest, sans-serif",K,0);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(W/2-460,775);x.lineTo(W/2+460,775);x.stroke();
  T("успешно прошёл(а) обучение для продавцов",850,"500 38px Onest, sans-serif",K,0);
  T(CFG.certCourse,910,"700 42px Onest, sans-serif",R,0);
  /* footer */
  var d=new Date(),ds=d.toLocaleDateString("ru-RU",{day:"2-digit",month:"long",year:"numeric"});
  x.textAlign="center";
  x.font="700 36px Onest, sans-serif";x.fillStyle=K;x.fillText(ds,340,1030);
  x.strokeStyle=K;x.lineWidth=2;x.beginPath();x.moveTo(190,1045);x.lineTo(490,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ДАТА",340,1080);
  x.font="800 34px Unbounded, Onest, sans-serif";x.fillStyle=K;x.fillText("CENTEK",W-340,1030);
  x.beginPath();x.moveTo(W-490,1045);x.lineTo(W-190,1045);x.stroke();
  x.font="500 22px Onest, sans-serif";x.fillStyle=G;x.fillText("ОТДЕЛ СЕТЕЙ",W-340,1080);
  /* seal */
  var cx=W/2,cy=1010,r1=84,r2=68;
  x.fillStyle=R;x.beginPath();
  for(var k=0;k<48;k++){var a=k*Math.PI/24,rr=k%2?r2+6:r1;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}
  x.closePath();x.fill();
  x.strokeStyle="#fff";x.lineWidth=3;x.beginPath();x.arc(cx,cy,56,0,Math.PI*2);x.stroke();
  x.fillStyle="#fff";x.font="800 20px Unbounded, Onest, sans-serif";x.textAlign="center";x.fillText("CENTEK",cx,cy+8);
  x.font="700 14px Onest, sans-serif";x.fillText("★ ★ ★",cx,cy+36);
}
function T_name(){return T.name}
function pdfFromJpeg(jpg,w,h){
  var enc=new TextEncoder(),parts=[],off=[],pos=0;
  function add(b){parts.push(b);pos+=b.length}function s(t){add(enc.encode(t))}
  s("%PDF-1.4\n");
  off[1]=pos;s("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  off[2]=pos;s("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  off[3]=pos;s("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  off[4]=pos;s("4 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n");add(jpg);s("\nendstream endobj\n");
  var cs="q 842 0 0 595 0 0 cm /Im0 Do Q";
  off[5]=pos;s("5 0 obj<</Length "+cs.length+">>stream\n"+cs+"\nendstream endobj\n");
  var xr=pos;s("xref\n0 6\n0000000000 65535 f \n");
  for(var i=1;i<=5;i++)s(("0000000000"+off[i]).slice(-10)+" 00000 n \n");
  s("trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
async function saveCert(){
  var msg=document.getElementById("dlmsg"),c=document.getElementById("cert");
  try{
    var b=await new Promise(function(r){c.toBlob(r,"image/jpeg",0.92)});
    var jpg=new Uint8Array(await b.arrayBuffer());
    var pdf=pdfFromJpeg(jpg,c.width,c.height),fn="Сертификат CENTEK МБТ - "+T.name+".pdf",dl=null;
    try{dl=(window.claude&&claude.use)?await claude.use("downloads"):null}catch(e){dl=null}
    if(dl){await dl.save({filename:fn,data:pdf})}
    else{var a=document.createElement("a");a.href=URL.createObjectURL(pdf);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
    msg.textContent="Готово.";
  }catch(e){msg.textContent=(e&&e.code==="declined")?"Сохранение отменено.":"Не удалось сохранить. Сделайте скриншот сертификата."}
}

/* ---------- render ---------- */
function render(){
  var s=SL[cur],blk=BLOCKS[s.b];
  document.documentElement.style.setProperty("--ac",blk.c);
  var h;
  if(s.type==="title")h=titleSlide();else if(s.type==="toc")h=tocSlide();else if(s.type==="cheat")h=cheatSlide();else if(s.type==="test")h=testSlide();else h=std(s);
  stage.innerHTML=h;
  stage.querySelectorAll(".slide").forEach(function(n){n.style.setProperty("--ac",blk.c)});
  document.getElementById("bar").style.width=((cur+1)/SL.length*100)+"%";
  var t="Слайд "+(cur+1)+" из "+SL.length;document.getElementById("cnt").textContent=t;document.getElementById("cnt2").textContent=t;
  document.getElementById("prev").disabled=cur===0;document.getElementById("next").disabled=cur===SL.length-1;
  document.querySelectorAll(".tab").forEach(function(b,i){b.setAttribute("aria-current",i===s.b?"true":"false")});
  if(s.type==="test"){
    var st=document.getElementById("start");if(st)st.onclick=startTest;
    var fin=document.getElementById("fin");if(fin){fin.onclick=finish;stage.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){T.ans[+r.name.slice(1)]=+r.value;document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}});document.getElementById("answered").textContent="Отвечено: "+Object.keys(T.ans).length+" из 10"}
    var ag=document.getElementById("again");if(ag)ag.onclick=function(){T.done=false;T.on=false;render()};
    var dl=document.getElementById("dl");if(dl){dl.onclick=saveCert;drawCert();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawCert)}
  }
  stage.querySelectorAll("[data-toggle]").forEach(function(b){var sc=b.closest(".scheme");function sync(){b.textContent=sc.classList.contains("open")?sc.getAttribute("data-off"):sc.getAttribute("data-on")}b.onclick=function(){sc.classList.toggle("open");sync()};if(sc.hasAttribute("data-auto"))setTimeout(function(){if(document.body.contains(sc)){sc.classList.add("open");sync()}},700)});
  stage.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(+b.getAttribute("data-go"))}});
  window.scrollTo(0,0);
}
function go(i){if(T.on&&SL[i].type!=="test"){return}cur=Math.max(0,Math.min(SL.length-1,i));render()}
var tabs=document.getElementById("tabs");
BLOCKS.forEach(function(b,i){var x=document.createElement("button");x.className="tab";x.textContent=b.n;x.onclick=function(){go(firstOf(i))};tabs.appendChild(x)});
document.getElementById("prev").onclick=function(){go(cur-1)};
document.getElementById("next").onclick=function(){go(cur+1)};
document.addEventListener("keydown",function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
render();
</script>
